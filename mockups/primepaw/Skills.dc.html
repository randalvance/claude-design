<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Skills — paper</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Nunito:wght@400;600;700;800&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e4dccb;font-family:"Nunito",system-ui,sans-serif;color:#2a2219}
a{color:var(--blue)}a:hover{color:var(--blue-2)}
.page{--desk:#e4dccb;--paper:#f8f3e9;--paper-2:#efe7d6;--hover:#efe7d6;--sheet:#fffdf7;--sheet-warm:#fffaf0;--card:#fffdf8;--rail:#e4d9c1;--line:#d6cab2;--kraft:#e2c48c;--kraft-2:#cfae72;--shadow:#cdbf9f;--ink:#2a2219;--mute:#6f6252;--faint:#9a8c74;--bar:#b9a98a;--red:#c8553d;--red-2:#8f3a2a;--blue:#3b5b9a;--blue-2:#2a4070;--green:#5b8c5a;--amber:#b8792f;--highlighter:#fff0a0;--highlighter-2:#d9b84a;--tape:#ffec969e;--white:#ffffff;--panel:#f3ecdd;--deck-1:#f1eadb;--deck-2:#ebe3d1;--rule:#dfe5ee;--attn:#f0c24a;--blush:#e8a9a2;--max:#c7935a;--max-2:#d9b48a;--kind-think:#4a8f99;--kind-sub:#8b6bb3;--stamp-ground:var(--stamp-ground);--stamp-ground-soft:var(--stamp-ground-soft);--veil:var(--veil);--knob:#ffffff;--glass:#fffdf780;--on-attn:#2a2219;--font-serif:"Fraunces",Georgia,serif;--font-sans:"Nunito",system-ui,sans-serif;--font-hand:"Caveat",cursive;--font-mono:"Courier New",Courier,ui-monospace,monospace;min-height:100vh;box-sizing:border-box;display:flex;justify-content:center;background:var(--desk);color:var(--ink)}
/* Night: the same desk after dark. Every ground drops to a warm near-black, ink turns to cream, kraft and the signal colours shift so they keep their contrast. */
.page.night{--desk:#15120e;--paper:#211c16;--paper-2:#2b251e;--hover:#3f362a;--sheet:#2d2720;--sheet-warm:#29231c;--card:#302a22;--rail:#1a1612;--panel:#1c1813;--deck-1:#27221b;--deck-2:#221d17;--line:#4a4034;--rule:#3b4350;--kraft:#6f5530;--kraft-2:#4e3a1f;--shadow:#0c0a07;--ink:#efe6d3;--mute:#b4a68e;--faint:#857863;--bar:#5e5343;--red:#d9654c;--red-2:#a8432e;--blue:#7d9bd8;--blue-2:#3d5a94;--green:#78a876;--amber:#d6964a;--highlighter:#5c4f14;--highlighter-2:#a88f2e;--attn:#e3b53a;--blush:#7a3d36;--max:#8c6436;--max-2:#5f4425;--kind-think:#5fa9b3;--kind-sub:#a58ad0;--white:#ffffff;--tape:#ffec9640;--stamp-ground:#211c16cc;--stamp-ground-soft:#211c168c;--veil:#000000a6;--knob:#efe6d3;--glass:#fffdf714;--on-attn:#2a2219;--cork:#5a4028;--cork-2:#3a2816;color-scheme:dark}
.page.night .app::after{background:#000;mix-blend-mode:screen;opacity:.16}

.pp-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
button{font:inherit}
.pp-ic{width:16px;height:16px;flex:none}

.app{position:relative;width:100%;display:flex;background:var(--paper);min-height:100vh}
.app::after{content:"";position:absolute;inset:0;background:#fff;filter:url(#pp-grain);opacity:.35;mix-blend-mode:multiply;pointer-events:none;z-index:3}

/* rail (Paper Chat: Rail) */
.pp-rail{width:64px;flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 0 10px;background:var(--rail);border-right:1px solid var(--line);box-sizing:border-box;overflow:auto;position:sticky;top:0;height:100vh;align-self:flex-start;z-index:1}
.pp-logo{width:36px;height:36px;display:grid;place-items:center;color:var(--red);margin-bottom:6px;transform:rotate(-6deg)}
.pp-rb{all:unset;cursor:pointer;position:relative;width:54px;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mute);font-size:10px;font-weight:800;border-radius:3px;transition:transform .2s steps(2),background .2s steps(2)}
.pp-rb svg{width:18px;height:18px}
.pp-rb:hover{background:var(--sheet-warm);transform:translateY(-1px)}
.pp-rb.is-on{background:var(--sheet-warm);color:var(--ink);box-shadow:2px 2px 0 var(--shadow);transform:rotate(-2deg)}
.pp-rb:focus-visible{outline:2px solid var(--blue)}
.pp-rb .pp-nb{position:absolute;top:0;right:4px;transform:rotate(8deg)}
.pp-nb{min-width:16px;height:16px;padding:0 4px;border-radius:50%;background:var(--red);color:var(--white);font-size:10px;font-weight:900;display:grid;place-items:center;box-shadow:1px 1px 0 rgba(0,0,0,.2);box-sizing:border-box;flex:none}
.pp-rail .pp-sp{flex:1}

/* header */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;z-index:1}
.top{display:flex;align-items:flex-end;gap:18px;padding:22px 28px 0;flex-wrap:wrap}
.ttl{display:flex;flex-direction:column;gap:2px;min-width:0}
.ttl h1{margin:0;font-family:var(--font-serif);font-weight:600;font-size:26px;letter-spacing:-.01em;font-variation-settings:"opsz" 48}
.ttl .sub{font-family:var(--font-hand);font-size:17px;color:var(--mute)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pp-search{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;background:var(--sheet);border:1px solid var(--line);box-shadow:2px 2px 0 var(--shadow);color:var(--mute);box-sizing:border-box;width:260px;max-width:100%}
.pp-search input{all:unset;flex:1;min-width:0;font-size:13px;color:var(--ink)}
.pp-search input::placeholder{color:var(--faint);font-family:var(--font-hand);font-size:16px}
.pp-kbd{font-family:var(--font-mono);font-size:10px;color:var(--mute);border:1px solid var(--line);padding:1px 4px;white-space:nowrap}
.pp-btn{all:unset;cursor:pointer;height:32px;padding:0 12px;background:var(--blue);color:var(--white);font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:6px;box-shadow:2px 2px 0 var(--blue-2);transition:transform .2s steps(2);box-sizing:border-box;white-space:nowrap}
.pp-btn:hover{transform:translateY(-1px)}
.pp-btn:focus-visible{outline:2px solid var(--ink)}
.pp-dashed{all:unset;cursor:pointer;font-size:11.5px;font-weight:800;color:var(--mute);border:1.5px dashed var(--bar);padding:3px 10px;border-radius:3px;white-space:nowrap;transition:transform .2s steps(2),color .2s steps(2),border-color .2s steps(2)}
.pp-dashed:hover{color:var(--ink);border-color:var(--ink);transform:translateY(-1px)}
.pp-dashed:focus-visible{outline:2px solid var(--blue)}
.pp-dashed.is-on{border-style:solid;border-color:var(--ink);color:var(--ink);background:var(--sheet);box-shadow:1px 1px 0 var(--shadow);transform:rotate(-1.5deg)}
.bar2{display:flex;align-items:center;gap:8px;padding:16px 28px 0;flex-wrap:wrap}
.bar2 .fl{font-family:var(--font-hand);font-size:15px;color:var(--mute);margin-right:2px}
.bar2 .hint{margin-left:auto;font-family:var(--font-hand);font-size:15px;color:var(--mute)}

/* cards */
.grid{flex:1;padding:22px 28px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px;align-content:start}
.skill{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:3px;box-shadow:3px 4px 0 var(--shadow);display:flex;flex-direction:column;transition:transform .2s steps(2),box-shadow .2s steps(2);animation:drop .35s steps(4) both}
.skill:hover{transform:translate(-1px,-1px);box-shadow:4px 5px 0 var(--shadow)}
.skill.is-off{background:var(--paper-2)}
.skill.is-off .hit,.skill.is-off .foot{opacity:.6}
.skill.is-off .hit .nm,.skill.is-off .hit .ds{color:var(--mute)}
.skill.is-off .ap{filter:grayscale(1)}
.cardtop{display:flex;align-items:center;gap:10px;padding:12px 14px 0 16px}
.stamp{font-family:var(--font-mono);font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:3px 6px;border:2px solid currentColor;border-radius:3px;transform:rotate(-4deg);opacity:.85;mix-blend-mode:multiply;background:var(--stamp-ground);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.stamp.builtin{color:var(--mute)}
.stamp.plugin{color:var(--blue)}
.stamp.project{color:var(--green)}
.stamp.yours{color:var(--red)}
.stamp .pl{font-weight:400;letter-spacing:.04em;text-transform:none}
.cardtop .ver{font-family:var(--font-hand);font-size:14px;color:var(--mute)}
.cardtop .sw{margin-left:auto}
.sw{all:unset;cursor:pointer;position:relative;width:36px;height:20px;border:1.5px solid var(--ink);background:var(--sheet);box-sizing:border-box;flex:none;transition:background .2s steps(2)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;background:var(--ink);transition:transform .2s steps(2),background .2s steps(2)}
.sw[aria-checked="true"]{background:var(--green)}
.sw[aria-checked="true"]::after{transform:translateX(17px);background:var(--white)}
.sw:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hit{display:flex;flex-direction:column;gap:5px;padding:10px 16px 8px;text-decoration:none;color:inherit;border-radius:3px}
.hit:hover{color:inherit}
.hit:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.hit .nm{font-size:15.5px;font-weight:800;line-height:1.2;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.hit .nm .slash{font-family:var(--font-mono);font-size:11.5px;font-weight:700;color:var(--mute);background:var(--paper-2);padding:1px 6px;border-radius:2px}
.hit .ds{font-size:13.5px;line-height:1.5;color:var(--ink)}
.hit .has{font-family:var(--font-hand);font-size:14.5px;color:var(--mute)}
.foot{margin-top:auto;display:flex;align-items:center;gap:8px;padding:6px 16px 12px;border-top:1px dashed var(--line);flex-wrap:wrap}
.foot .onfor{display:inline-flex;align-items:center;gap:4px}
.ap{width:22px;height:22px;flex:none;background:var(--paper-2);border:1px solid var(--line);box-shadow:1px 1px 0 var(--shadow);display:grid;place-items:center;transform:rotate(-3deg)}
.ap svg{width:18px;height:18px;shape-rendering:crispEdges;display:block}
.foot .onfor .ap{margin-left:-6px}
.foot .onfor .ap:first-child{margin-left:0}
.sq{width:12px;height:12px;flex:none;background:var(--c);box-shadow:1px 1px 0 rgba(0,0,0,.18);transform:rotate(-6deg)}
.foot .sqs{display:inline-flex;gap:5px;align-items:center}
.foot .used{margin-left:auto;font-family:var(--font-hand);font-size:14.5px;color:var(--mute);text-align:right}
.foot .nouse{color:var(--faint)}
.newc{all:unset;cursor:pointer;min-height:170px;border:1.5px dashed var(--bar);border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--mute);font-family:var(--font-hand);font-size:20px;transition:transform .2s steps(2),border-color .2s steps(2),color .2s steps(2);box-sizing:border-box}
.newc:hover{transform:translateY(-2px);border-color:var(--ink);color:var(--ink)}
.newc:focus-visible{outline:2px solid var(--blue)}
.newc .plus{width:44px;height:44px;border-radius:50%;background:var(--kraft);box-shadow:1px 2px 0 var(--kraft-2);display:grid;place-items:center;color:var(--ink);transform:rotate(-7deg)}
.newc .plus svg{width:20px;height:20px}
.pp-scrap{grid-column:1/-1;font-family:var(--font-hand);font-size:22px;color:var(--mute);padding:40px 0;text-align:center;transform:rotate(-1deg)}
.demo{display:flex;align-items:center;gap:10px;justify-content:center;font-family:var(--font-hand);font-size:16px;color:var(--mute);padding:0 28px 16px;flex-wrap:wrap;text-align:center}

@keyframes drop{from{transform:translateY(-10px) rotate(-1deg);opacity:0}to{transform:none;opacity:1}}
@media (max-width:860px){.app{flex-direction:column}.pp-rail{position:static;height:auto;width:100%;flex-direction:row;justify-content:center;border-right:0;border-bottom:1px solid var(--line);padding:6px}.pp-rail .pp-sp{display:none}.pp-logo{margin:0 6px 0 0}.top,.grid,.demo,.bar2{padding-left:16px;padding-right:16px}.top-r{margin-left:0;width:100%}.pp-search{width:100%}.bar2 .hint{display:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</helmet>
<div class="page {{themeCls}}">
<svg width="0" height="0" style="position: absolute" aria-hidden="true"><filter id="pp-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="matrix" values="0 0 0 0 0.36 0 0 0 0 0.29 0 0 0 0 0.18 0 0 0 0.5 0"></feColorMatrix></filter></svg>
<div class="app">

  <nav class="pp-rail" aria-label="Primary">
    <div class="pp-logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><circle cx="7" cy="8" r="2.2"></circle><circle cx="12" cy="5.5" r="2.2"></circle><circle cx="17" cy="8" r="2.2"></circle><path d="M12 10c-3.5 0-6.5 3-6.5 6 0 1.8 1.3 3 3 3 1.2 0 2.2-.6 3.5-.6s2.3.6 3.5.6c1.7 0 3-1.2 3-3 0-3-3-6-6.5-6z"></path></svg></div>
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="10">
      <button class="pp-rb {{n.cls}}" aria-current="{{n.cur}}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
        <span>{{n.label}}</span>
        <sc-if value="{{n.hasBadge}}" hint-placeholder-val="{{false}}"><span class="pp-nb">{{n.badge}}</span></sc-if>
      </button>
    </sc-for>
    <span class="pp-sp"></span>
    <button class="pp-rb" onClick="{{toggleTheme}}" aria-label="{{themeLabel}}" aria-pressed="{{isNight}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{themeIcon}}"></path></svg><span>{{themeWord}}</span></button>
    <button class="pp-rb" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg><span>Settings</span></button>
  </nav>

  <main class="main">
    <header class="top">
      <div class="ttl"><h1>Skills</h1><span class="sub">{{sub}}</span></div>
      <div class="top-r">
        <label class="pp-search"><svg class="pp-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><input type="search" placeholder="Find a skill…" aria-label="Find a skill" ref="{{qRef}}" onInput="{{onSearch}}"><span class="pp-kbd">⌘K</span></label>
        <button class="pp-btn"><svg class="pp-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New skill</button>
      </div>
    </header>

    <div class="bar2">
      <span class="fl">Show</span>
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="6"><button class="pp-dashed {{f.cls}}" onClick="{{f.pick}}" aria-pressed="{{f.on}}">{{f.label}}</button></sc-for>
      <span class="hint">{{hint}}</span>
    </div>

    <section class="grid" aria-label="Skills">
      <sc-for list="{{skills}}" as="s" hint-placeholder-count="14">
        <article class="skill {{s.cls}}">
          <div class="cardtop"><span class="stamp {{s.src}}">{{s.srcLabel}}<sc-if value="{{s.hasFrom}}" hint-placeholder-val="{{false}}"><span class="pl">· {{s.from}}</span></sc-if></span><span class="ver">{{s.ver}}</span><button class="sw" role="switch" aria-checked="{{s.on}}" onClick="{{s.toggle}}" aria-label="{{s.swAria}}"></button></div>
          <a class="hit" href="Skill.dc.html">
            <span class="nm"><span>{{s.name}}</span><span class="slash">/{{s.id}}</span></span>
            <span class="ds">{{s.desc}}</span>
            <span class="has">{{s.has}}</span>
          </a>
          <div class="foot">
            <span class="onfor" aria-label="{{s.agentsAria}}"><sc-for list="{{s.agents}}" as="a" hint-placeholder-count="2"><span class="ap" title="{{a.name}}" aria-hidden="true"><svg viewBox="0 0 12 12"><sc-for list="{{a.px}}" as="p" hint-placeholder-count="70"><rect x="{{p.x}}" y="{{p.y}}" width="1" height="1" fill="{{p.c}}"></rect></sc-for></svg></span></sc-for></span>
            <span class="sqs" aria-label="{{s.wsAria}}"><sc-for list="{{s.wss}}" as="w" hint-placeholder-count="2"><span class="sq" style="--c:{{w.color}}" title="{{w.name}}"></span></sc-for></span>
            <span class="used {{s.usedCls}}">{{s.used}}</span>
          </div>
        </article>
      </sc-for>
      <sc-if value="{{empty}}" hint-placeholder-val="{{false}}"><div class="pp-scrap">{{emptyText}}</div></sc-if>
      <sc-if value="{{showNew}}" hint-placeholder-val="{{true}}"><button class="newc"><span class="plus" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>Write a new skill</button></sc-if>
    </section>

    <div class="demo"><span>{{demoText}}</span><button class="pp-dashed" onClick="{{reset}}">Reset demo</button></div>
  </main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"paper","options":["paper","night"]},"$preview":{"width":1440,"height":900}}'>
const NAV = [
  { id: 'sessions', label: 'Sessions', icon: 'M21 12a8 8 0 0 1-11.6 7.1L4 21l1.4-4.9A8 8 0 1 1 21 12z', badge: 1 },
  { id: 'agents', label: 'Agents', icon: 'M4 8h16v12H4zM12 8V4M8 14h.01M16 14h.01M2 12h2M20 12h2' },
  { id: 'skills', label: 'Skills', icon: 'M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2zM19 15l1 2 2 1-2 1-1 2-1-2-2-1 2-1z' },
  { id: 'workspaces', label: 'Workspaces', icon: 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z' },
  { id: 'memory', label: 'Memory', icon: 'M12 3a4 4 0 0 0-4 4v1a4 4 0 0 0-3 3.9 4 4 0 0 0 1 2.6V17a3 3 0 0 0 3 3h6a3 3 0 0 0 3-3v-2.5a4 4 0 0 0 1-2.6A4 4 0 0 0 16 8V7a4 4 0 0 0-4-4z' },
  { id: 'mcps', label: 'MCPs', icon: 'M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0zM12 17v4' },
  { id: 'workflows', label: 'Workflows', icon: 'M6 3v12M18 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM18 9a9 9 0 0 1-9 9' },
  { id: 'kanban', label: 'Kanban', icon: 'M4 4h4v16H4zM10 4h4v10h-4zM16 4h4v7h-4z' },
  { id: 'prs', label: 'PRs', icon: 'M6 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM18 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 9v6M18 15V9a3 3 0 0 0-3-3h-3M13 3l-3 3 3 3', badge: 7 },
  { id: 'bg', label: 'Backgr.', icon: 'M21 12a9 9 0 1 1-3-6.7M21 3v6h-6' }
];
const PAL = { i: '#2a2219', b: '#3b5b9a', B: '#2a4070', g: '#5b8c5a', r: '#c8553d', R: '#8f3a2a', k: '#e2c48c', K: '#cfae72', a: '#b8792f', w: '#fffdf7', t: '#4a8f99', s: '#8b6bb3', m: '#6f6252', h: '#fff0a0' };
const SPRITES = {

  implementer: ['............','..gggggggg..','..gggggggg..','..giiiiiig..','..giwiiwig..','..giiiiiig..','..gggggggg..','..ggkkkkgg..','..gggggggg..','...g.gg.g...','..kk.gg.kk..','..kk....kk..'],
  issue: ['...rrrrrr...','..rrrrrrrr..','..rRRRRRRr..','..kkkkkkkk..','..kwkkkkwk..','..kikkkkik..','..kkkkkkkk..','..kkkiikkk..','...kkkkkk...','..wwwwwwww..','..wiiwwiiw..','..wwwwwwww..'],

  triage: ['............','..aaaaaaaa..','..aaawwaaa..','..aawwwwaa..','..aaawwaaa..','..aaaaaaaa..','..awwaawwa..','..aiwaawia..','..aaaaaaaa..','..aaawwaaa..','...aaaaaa...','............'],
  release: ['.....ww.....','....wrrw....','....wrrw....','...wrrrrw...','...wrbbrw...','...wrbbrw...','...wrrrrw...','..rwrrrrwr..','..rwwwwwwr..','..r.aaaa.r..','....a..a....','....a..a....'],
  support: ['............','...tttttt...','..tttttttt..','.tt.kkkk.tt.','.t.kkkkkk.t.','.t.kwkkwk.t.','.tt.kkkk.tt.','.tt.kiik.tt.','..tttkkttt..','.....kk..t..','....tttttt..','............'],
  planner: ['............','..ssssssss..','..swwssmms..','..swissmms..','..ssssssss..','..skkkkkks..','..sskkkkss..','...ssssss...','..bbbbbbbb..','..b.b..b.b..','..bbbbbbbb..','............']
};
function px(rows) { const out = []; rows.forEach((row, y) => { Array.from(row).forEach((ch, x) => { if (ch !== '.') out.push({ x, y, c: PAL[ch] }); }); }); return out; }
const AGENTS = { curator: 'Curator', implementer: 'Implementer', issue: 'Issue Creator', reviewer: 'Reviewer', triage: 'Triage', release: 'Release Captain', support: 'Support Writer', planner: 'Infra Planner' };
const WS = { lighthouse: { name: 'Lighthouse Web', color: '#5b8c5a' }, orbit: { name: 'Orbit Billing', color: '#c8553d' }, fleet: { name: 'Fleet Infra', color: '#b8792f' }, atlas: { name: 'Atlas Docs', color: '#3b5b9a' }, harbor: { name: 'Harbor Mobile', color: '#8b6bb3' }, kiln: { name: 'Kiln Data', color: '#4a8f99' } };
const SRC = { builtin: 'Built-in', plugin: 'Plugin', project: 'Project', yours: 'Yours' };
// A skill: id is its slash name; src is where it comes from; from names the plugin or project; agents and wss are where it is switched on.
const S = (id, name, src, from, ver, on, desc, has, agents, wss, used, runs) => ({ id, name, src, from, ver, on, desc, has, agents, wss, used, runs });
const SKILLS = [
  S('pr-description', 'PR description', 'builtin', '', 'v2.1', true, 'Writes the pull request body from the diff and the ticket: what changed, why, and how to test it.', 'SKILL.md · 1 reference', ['implementer', 'curator'], ['lighthouse', 'orbit', 'harbor'], 'used 2 h ago', 41),
  S('code-review', 'Code review', 'builtin', '', 'v3.0', true, 'Reads a diff the way a careful colleague would: correctness first, then naming, then the nits it keeps to itself.', 'SKILL.md · 2 references', ['reviewer'], ['lighthouse', 'orbit', 'fleet', 'harbor'], 'used 40 min ago', 67),
  S('commit', 'Commit message', 'builtin', '', 'v1.6', true, 'Writes the commit message in the house style and splits unrelated changes into their own commits.', 'SKILL.md', ['implementer', 'curator', 'release'], ['lighthouse', 'orbit', 'fleet', 'atlas', 'harbor', 'kiln'], 'used 12 min ago', 118),
  S('changelog', 'Changelog entry', 'yours', '', 'v3', true, 'Drafts a changelog entry from the merged PRs since the last release, grouped by what changed for users rather than by repository.', 'SKILL.md · 1 script · 1 reference', ['curator'], ['lighthouse'], 'used 2 h ago', 23),
  S('deploy', 'Deploy', 'plugin', 'fleet-tools', 'v0.9', true, 'Ships an environment with `fleet ship`, watches the health checks for ten minutes and rolls back if a budget is blown.', 'SKILL.md · 3 scripts', ['release'], ['fleet'], 'used yesterday', 9),
  S('jira', 'Jira tickets', 'plugin', 'atlassian', 'v1.2', true, 'Reads, creates and moves tickets on the linked Kanban board, and writes the Jira comment before the PR description.', 'SKILL.md · 1 reference', ['implementer', 'triage', 'issue'], ['orbit', 'harbor'], 'used 1 h ago', 54),
  S('invoice-pdf', 'Invoice PDF', 'project', 'Orbit Billing', 'v2', true, 'Reads an invoice PDF and pulls out the fields the ledger needs, then files a ticket with the gist.', 'SKILL.md · 1 script', ['issue'], ['orbit'], 'used 32 min ago', 15),
  S('migration', 'Reversible migration', 'project', 'Orbit Billing', 'v1', true, 'Writes a migration with a rollback section and a test that runs it both ways before the PR opens.', 'SKILL.md · 1 reference', ['implementer'], ['orbit'], 'used Tue', 6),
  S('terraform-plan', 'Terraform plan', 'plugin', 'fleet-tools', 'v0.9', true, 'Explains a Terraform plan module by module with the blast radius before anything is applied.', 'SKILL.md · 1 script', ['planner'], ['fleet'], 'used Mon', 4),
  S('docs-page', 'Docs page', 'project', 'Atlas Docs', 'v1', true, 'Writes an MDX docs page with frontmatter, an owner, a last-reviewed date and a runnable example first.', 'SKILL.md · 1 reference', ['support', 'curator'], ['atlas'], 'used Thu', 11),
  S('design-tokens', 'Design tokens check', 'project', 'Lighthouse Web', 'v1', false, 'Checks a UI change against the Paper Chat tokens and flags any hard-coded colour, size or shadow.', 'SKILL.md · 1 script', ['reviewer'], ['lighthouse'], 'off since 20 Oct', 0),
  S('support-reply', 'Support reply', 'yours', '', 'v1', false, 'Drafts a support answer from the docs and recent fixes, and flags what it is not sure about instead of guessing.', 'SKILL.md', ['support'], ['atlas'], 'never used', 0),
  S('screenshot-diff', 'Screenshot diff', 'yours', '', 'v2', false, 'Takes before and after screenshots of a UI change at three widths and lays them side by side in the PR.', 'SKILL.md · 2 scripts', ['implementer', 'reviewer'], ['lighthouse', 'harbor'], 'off since 14 Oct', 0),
  S('release-cut', 'Release cut', 'plugin', 'fleet-tools', 'v0.9', false, 'Cuts a release branch from main, rebases open work onto it and tags it.', 'SKILL.md · 1 script', ['release'], ['fleet'], 'never used', 0)
];
const FILTERS = [{ id: 'all', label: 'All' }, { id: 'on', label: 'On' }, { id: 'off', label: 'Off' }, { id: 'builtin', label: 'Built-in' }, { id: 'plugin', label: 'From plugins' }, { id: 'project', label: 'From a project' }, { id: 'yours', label: 'Yours' }];
const INIT = { q: '', filter: 'all', on: Object.fromEntries(SKILLS.map((s) => [s.id, s.on])), msg: '' };
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');

class Component extends DCLogic {
  state = { ...INIT, on: { ...INIT.on } };
  // Theme: the "theme" prop picks the default (paper by day, night in the dark); the moon button in the rail flips it for this view.
  themeVals() {
    const night = this.state.night ?? ((this.props.theme ?? 'paper') === 'night');
    return { themeCls: night ? 'night' : '', isNight: night, themeWord: night ? 'Day' : 'Night',
      themeLabel: night ? 'Switch to the paper theme' : 'Switch to the night theme',
      themeIcon: night ? 'M12 4V2M12 22v-2M4 12H2M22 12h-2M5.6 5.6L4.2 4.2M19.8 19.8l-1.4-1.4M5.6 18.4l-1.4 1.4M19.8 4.2l-1.4 1.4M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z' : 'M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z',
      toggleTheme: () => this.setState({ night: !night }) };
  }
  renderVals() { return { ...this.themeVals(), ...this.renderVals0() }; }
  renderVals0() {
    const st = this.state;
    const q = st.q.trim().toLowerCase();
    const match = (s) => !q || s.name.toLowerCase().includes(q) || s.id.includes(q) || s.desc.toLowerCase().includes(q) || (s.from || '').toLowerCase().includes(q);
    const passes = (s) => st.filter === 'all' || (st.filter === 'on' ? st.on[s.id] : st.filter === 'off' ? !st.on[s.id] : s.src === st.filter);
    const list = SKILLS.filter((s) => match(s) && passes(s));
    const onN = SKILLS.filter((s) => st.on[s.id]).length;
    return {
      nav: NAV.map((n) => ({ ...n, cls: n.id === 'skills' ? 'is-on' : '', cur: n.id === 'skills' ? 'page' : false, hasBadge: !!n.badge, badge: n.badge || '' })),
      sub: SKILLS.length + ' skills · ' + onN + ' on · ' + SKILLS.filter((s) => s.src === 'plugin').length + ' from plugins · ' + SKILLS.filter((s) => s.src === 'yours').length + ' yours',
      qRef: (el) => { if (el) this.q = el; },
      onSearch: (e) => this.setState({ q: e.currentTarget.value }),
      filters: FILTERS.map((f) => ({ label: f.label, on: st.filter === f.id, cls: st.filter === f.id ? 'is-on' : '', pick: () => this.setState({ filter: f.id }) })),
      hint: 'a skill is a folder with a SKILL.md · the switch turns it off everywhere',
      skills: list.map((s) => {
        const on = st.on[s.id];
        return {
          id: s.id, name: s.name, desc: s.desc, has: s.has, ver: s.ver,
          src: s.src, srcLabel: SRC[s.src], hasFrom: !!s.from, from: s.from,
          on, cls: on ? '' : 'is-off', swAria: (on ? 'Turn off ' : 'Turn on ') + s.name,
          toggle: () => this.setState({ on: { ...st.on, [s.id]: !on }, msg: (on ? 'Turned off ' : 'Turned on ') + s.name + (on ? ' · agents stop seeing it on their next session' : ' · back on for ' + plural(s.agents.length, 'agent')) }),
          agents: s.agents.map((a) => ({ name: AGENTS[a], px: px(SPRITES[a]) })),
          agentsAria: 'On for ' + s.agents.map((a) => AGENTS[a]).join(', '),
          wss: s.wss.map((w) => ({ name: WS[w].name, color: WS[w].color })),
          wsAria: 'In ' + s.wss.map((w) => WS[w].name).join(', '),
          used: on ? (s.runs ? s.used + ' · ' + s.runs + ' this month' : s.used) : s.used, usedCls: s.runs ? '' : 'nouse'
        };
      }),
      empty: list.length === 0,
      emptyText: q ? 'No skill matches “' + st.q.trim() + '”' : 'Nothing here',
      showNew: !q && st.filter === 'all',
      demoText: st.msg || 'Click a card to open the skill · the switch turns it on or off · portraits and squares show which agents and workspaces have it',
      reset: () => { if (this.q) this.q.value = ''; this.setState({ ...INIT, on: { ...INIT.on } }); }
    };
  }
}
</script>
