<!-- @dsCard group="Materials" height=150 subtitle="The paw, badges, pills, chips, dots, the pinwheel" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kraft · Sticker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Nunito:wght@400;600;700;800;900&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;min-height:100%}
.cap{font-family:var(--font-hand);font-size:16px;color:var(--mute);width:86px;flex:none;line-height:1}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wrap{display:flex;flex-direction:column;gap:18px;padding:20px 24px}
.row{gap:14px}
</style>
</head>
<body class="kr-root">
<div class="wrap">
  <div class="row"><span class="cap">marks</span>
    <span class="kr-mark" role="img" aria-label="Primepaw"><svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><circle cx="7" cy="8" r="2.2"/><circle cx="12" cy="5.5" r="2.2"/><circle cx="17" cy="8" r="2.2"/><path d="M12 10c-3.5 0-6.5 3-6.5 6 0 1.8 1.3 3 3 3 1.2 0 2.2-.6 3.5-.6s2.3.6 3.5.6c1.7 0 3-1.2 3-3 0-3-3-6-6.5-6z"/></svg></span>
    <span class="kr-sticker kr-blue" style="width:44px;height:44px"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 21l1.4-4.9A8 8 0 1 1 21 12z"/></svg></span>
    <span class="kr-sticker kr-red is-on" style="width:44px;height:44px"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a4 4 0 0 0-4 4v1a4 4 0 0 0-3 3.9 4 4 0 0 0 1 2.6V17a3 3 0 0 0 3 3h6a3 3 0 0 0 3-3v-2.5a4 4 0 0 0 1-2.6A4 4 0 0 0 16 8V7a4 4 0 0 0-4-4z"/></svg></span>
    <span class="kr-sticker kr-teal is-round" style="width:36px;height:36px"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v12M18 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM18 9a9 9 0 0 1-9 9"/></svg></span>
    <span class="cap" style="width:auto">badges</span>
    <span class="kr-nb" aria-label="3 new">3</span>
    <span class="kr-nb kr-red" aria-label="12 new">12</span>
    <span class="kr-nb kr-red is-row" aria-label="2 new">2</span>
    <span class="cap" style="width:auto">pills</span>
    <span class="kr-pill">Idle</span>
    <span class="kr-pill is-busy">Busy</span>
    <span class="kr-pill is-attn">Needs you</span>
    <span class="cap" style="width:auto">chips</span>
    <span class="kr-chip">Done</span>
    <span class="kr-pin" role="img" aria-label="Working"><svg aria-hidden="true" viewBox="0 0 24 24"><g><path class="b1" d="M2 2h10v10z"/><path class="f1" d="M12 2l5 5-5 5z"/><path class="b2" d="M22 2v10H12z"/><path class="f2" d="M22 12l-5 5-5-5z"/><path class="b3" d="M22 22H12V12z"/><path class="f3" d="M12 22l-5-5 5-5z"/><path class="b4" d="M2 22V12h10z"/><path class="f4" d="M2 12l5-5 5 5z"/><path class="fold" d="M12 2v10M22 12H12M12 22V12M2 12h10"/><circle class="axle" cx="12" cy="12" r="2.4"/><circle class="glint" cx="11.2" cy="11.2" r=".8"/></g></svg></span>
    <span class="kr-dot" aria-hidden="true"></span>
    <span class="kr-dot" style="background:var(--green)" aria-hidden="true"></span>
    <span class="kr-dot" style="background:var(--amber)" aria-hidden="true"></span>
  </div>
</div>
</body>
</html>
