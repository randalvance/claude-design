<!-- @dsCard group="Actions" height=300 subtitle="Cardboard: kraft, sage, terracotta, latched" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kraft · Button</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Nunito:wght@400;600;700;800;900&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;min-height:100%}
.cap{font-family:var(--font-hand);font-size:16px;color:var(--mute);width:86px;flex:none;line-height:1}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wrap{display:flex;flex-direction:column;gap:18px;padding:20px 24px}
</style>
</head>
<body class="kr-root">
<div class="wrap">
  <div class="row"><span class="cap">kraft</span>
    <button class="kr-btn"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>New session</button>
    <button class="kr-btn"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Copy link</button>
    <button class="kr-btn">Open folder</button>
    <button class="kr-btn">Cancel</button>
    <button class="kr-btn" disabled><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>Send</button>
  </div>
  <div class="row"><span class="cap">sage</span>
    <button class="kr-btn kr-green"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>Merge</button>
    <button class="kr-btn kr-green"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8.5v7M18 10.5c0 4-12 3-12 5"/></svg>Run on main</button>
    <span class="cap" style="width:auto">terracotta</span>
    <button class="kr-btn kr-red"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 10v6M14 10v6"/></svg>Delete</button>
    <button class="kr-btn kr-red"><svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>Stop</button>
  </div>
  <div class="row"><span class="cap">latched</span>
    <button class="kr-btn" aria-pressed="false">Mine</button>
    <button class="kr-btn is-on" aria-pressed="true">Busy</button>
    <button class="kr-btn kr-green is-on" aria-pressed="true"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>Following</button>
    <span class="cap" style="width:auto">busy</span>
    <button class="kr-btn" aria-busy="true"><span class="kr-pin" role="img" aria-label="Working"><svg aria-hidden="true" viewBox="0 0 24 24"><g><path class="b1" d="M2 2h10v10z"/><path class="f1" d="M12 2l5 5-5 5z"/><path class="b2" d="M22 2v10H12z"/><path class="f2" d="M22 12l-5 5-5-5z"/><path class="b3" d="M22 22H12V12z"/><path class="f3" d="M12 22l-5-5 5-5z"/><path class="b4" d="M2 22V12h10z"/><path class="f4" d="M2 12l5-5 5 5z"/><path class="fold" d="M12 2v10M22 12H12M12 22V12M2 12h10"/><circle class="axle" cx="12" cy="12" r="2.4"/><circle class="glint" cx="11.2" cy="11.2" r=".8"/></g></svg></span>Running</button>
  </div>
  <div class="row"><span class="cap">sizes</span>
    <button class="kr-btn is-sm"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>New</button>
    <button class="kr-btn is-sm">Cancel</button>
    <button class="kr-btn is-sm kr-red"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 10v6M14 10v6"/></svg>Remove</button>
    <button class="kr-btn is-lg"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>Send to agent</button>
    <button class="kr-btn is-lg kr-green"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>Save draft</button>
  </div>
</div>
</body>
</html>
