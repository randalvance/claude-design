<!-- @dsCard group="Actions" height=150 subtitle="Switch, check, paper filter, printed stamp, sticker" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kraft · Toggle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Nunito:wght@400;600;700;800;900&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;min-height:100%}
.cap{font-family:var(--font-hand);font-size:16px;color:var(--mute);width:86px;flex:none;line-height:1}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wrap{display:flex;flex-direction:column;gap:18px;padding:20px 24px}
</style>
</head>
<body class="kr-root">
<div class="wrap">
  <div class="row"><span class="cap">switch</span>
    <button class="kr-switch" role="switch" aria-checked="false" aria-label="Auto-approve"></button>
    <button class="kr-switch" role="switch" aria-checked="true" aria-label="Auto-approve"></button>
    <button class="kr-switch" role="switch" aria-checked="false" aria-label="Auto-approve" disabled></button>
    <span class="cap" style="width:auto">check</span>
    <button class="kr-check" role="checkbox" aria-checked="false" aria-label="Run tests"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></button>
    <button class="kr-check" role="checkbox" aria-checked="true" aria-label="Run tests"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></button>
  </div>
  <div class="row"><span class="cap">paper</span>
    <button class="kr-btn kr-btn-paper" aria-pressed="false">Mine</button>
    <button class="kr-btn kr-btn-paper is-on" aria-pressed="true">Busy</button>
    <span class="cap" style="width:auto">printed</span>
    <button class="kr-btn kr-btn-print" aria-pressed="false">Watch</button>
    <button class="kr-btn kr-btn-print is-on" aria-pressed="true">Watching</button>
    <span class="cap" style="width:auto">sticker</span>
    <button class="kr-ib kr-blue" aria-pressed="false" aria-label="Sessions"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 21l1.4-4.9A8 8 0 1 1 21 12z"/></svg></button>
    <button class="kr-ib kr-blue is-on" aria-pressed="true" aria-label="Sessions"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 21l1.4-4.9A8 8 0 1 1 21 12z"/></svg></button>
  </div>
</div>
</body>
</html>
