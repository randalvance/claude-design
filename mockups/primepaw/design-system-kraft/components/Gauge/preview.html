<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kraft · Gauge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Nunito:wght@400;600;700;800;900&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;min-height:100%}
.wrap{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start;padding:24px}

</style>
</head>
<body class="kr-root">
<div class="wrap">
  <span class="kr-gauge" role="img" aria-label="Context window: 31 percent left"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="track" cx="20" cy="20" r="14" transform="rotate(135 20 20)"></circle><circle class="fill" cx="20" cy="20" r="14" transform="rotate(135 20 20)" stroke-dasharray="20.5 87.96"></circle><text x="6" y="36">E</text><text x="29" y="36">F</text><line class="needle" x1="20" y1="20" x2="30.5" y2="20" style="transform:rotate(219deg)"></line><circle class="hub" cx="20" cy="20" r="2.2"></circle></svg><span>31%</span></span>
</div>
</body>
</html>
