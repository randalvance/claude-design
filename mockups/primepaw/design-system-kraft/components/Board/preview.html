<!-- @dsCard group="Materials" height=270 subtitle="Cardboard, a mat, the frame" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kraft · Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Nunito:wght@400;600;700;800;900&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;min-height:100%}
.wrap{padding:24px 28px;display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:22px 26px;align-items:start}
.lab{font-family:var(--font-hand);font-size:15px;color:var(--mute);margin-bottom:8px;line-height:1}
.p{padding:9px 12px;font-size:12.5px}
.p b{font-weight:800}
.p i{font-family:var(--font-hand);font-style:normal;font-size:15px;color:var(--mute)}
.ta{width:100%;box-sizing:border-box;min-height:64px;padding:10px 12px;font-family:var(--font-sans);font-size:13px;color:var(--ink);background:transparent;border:0;outline:0;resize:none}
.ta::placeholder{font-family:var(--font-hand);font-size:16px;color:var(--faint)}
</style>
</head>
<body class="kr-root">
<div class="wrap kr-desk">
  <div><div class="lab">cardboard board · lift-board</div><div class="kr-board" style="padding:12px;display:flex;flex-direction:column;gap:8px"><div class="kr-sheet p"><b>Issue Creator</b> <i>2h ago</i></div><div class="kr-sheet p"><b>Paper diorama</b> <i>12m ago</i></div><div class="kr-sheet is-hl p" style="transform:rotate(var(--tilt-row-on))"><b>Kraft</b> <i>now</i></div></div></div>
  <div><div class="lab">sage mat · lift-mat</div><div class="kr-board is-mat" style="padding:7px"><div class="kr-sheet is-card p"><b>Read the spec</b> <i>done</i></div><div class="kr-sheet is-card p" style="margin-top:6px"><b>Write the tokens</b> <i>working</i></div></div></div>
  <div><div class="lab">terracotta frame · recess</div><div class="kr-board is-frame"><div class="kr-sheet is-card" style="border-radius:var(--radius-4)"><textarea class="ta" placeholder="Ask Primepaw anything…"></textarea></div></div></div>
</div>
</body>
</html>
