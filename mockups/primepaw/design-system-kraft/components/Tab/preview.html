<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kraft · Tab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Nunito:wght@400;600;700;800;900&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;min-height:100%}
.wrap{padding:24px 28px}
.sheet{padding:10px 0 0;border-radius:var(--radius-10)}
.t{font-family:var(--font-serif);font-size:26px;font-weight:600;line-height:1.2;letter-spacing:-.01em;font-variation-settings:"opsz" 48;margin:0 0 4px}
.s{font-family:var(--font-serif);font-style:italic;font-size:16px;color:var(--mute);margin:0}
.x{width:12px;height:12px}
</style>
</head>
<body class="kr-root">
<div class="wrap kr-desk">
  <div class="kr-sheet is-3 is-warm sheet">
    <div class="kr-tabs" role="tablist" style="margin-bottom:10px">
      <button class="kr-tab is-on" role="tab" aria-selected="true"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 21l1.4-4.9A8 8 0 1 1 21 12z"/></svg>Chat</button>
      <button class="kr-tab" role="tab" aria-selected="false"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v12M18 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM18 9a9 9 0 0 1-9 9"/></svg>Git</button>
      <button class="kr-tab" role="tab" aria-selected="false"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6h10M10 12h10M10 18h10M4 6l1.2 1.2L7.5 4.8M4 12l1.2 1.2 2.3-2.4M4 18l1.2 1.2 2.3-2.4"/></svg>Todos</button>
      <button class="kr-tab" role="tab" aria-selected="false"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z"/></svg>Tools</button>
      <button class="kr-tab" role="tab" aria-selected="false"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4zM8 9l3 3-3 3M13 15h3"/></svg>Terminal</button>
      <button class="kr-tab" role="tab" aria-selected="false"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 12h7M9 16h7"/></svg>Logs</button>
    </div>
    <div class="kr-tabs" role="tablist">
      <button class="kr-tab" role="tab" aria-selected="false">Issue Creator <span class="kr-tab-x" aria-label="Close">×</span></button>
      <button class="kr-tab is-on" role="tab" aria-selected="true">Paper diorama <span class="kr-tab-x" aria-label="Close">×</span></button>
      <button class="kr-tab" role="tab" aria-selected="false">Kraft <span class="kr-pin" style="width:14px;height:14px" role="img" aria-label="Working"><svg aria-hidden="true" viewBox="0 0 24 24"><g><path class="b1" d="M2 2h10v10z"/><path class="f1" d="M12 2l5 5-5 5z"/><path class="b2" d="M22 2v10H12z"/><path class="f2" d="M22 12l-5 5-5-5z"/><path class="b3" d="M22 22H12V12z"/><path class="f3" d="M12 22l-5-5 5-5z"/><path class="b4" d="M2 22V12h10z"/><path class="f4" d="M2 12l5-5 5 5z"/><path class="fold" d="M12 2v10M22 12H12M12 22V12M2 12h10"/><circle class="axle" cx="12" cy="12" r="2.4"/><circle class="glint" cx="11.2" cy="11.2" r=".8"/></g></svg></span></button>
      <button class="kr-tab" role="tab" aria-label="New tab" style="padding:8px 10px 15px"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div class="kr-leaf" role="tabpanel" style="padding:24px 24px 28px">
      <h2 class="t">Paper diorama</h2>
      <p class="s">The same shell, rebuilt as cardboard and paper cut-outs laid on one cream sheet.</p>
    </div>
  </div>
</div>
</body>
</html>
