<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kraft · QuestionSheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Nunito:wght@400;600;700;800;900&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;min-height:100%}
.wrap{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start;padding:24px}

</style>
</head>
<body class="kr-root">
<div class="wrap" style="flex-direction:column;align-items:stretch">
  <section class="kr-slip"><div class="kr-slip-in"><div class="kr-slip-h"><h4 class="kr-slip-q">Two quick questions</h4><span class="kr-q-hint">1 of 2 answered</span></div><div class="kr-q"><div class="kr-q-h"><span class="kr-q-t">How long should browser events be kept?</span><span class="kr-q-hint">Retention · pick one</span></div><button class="kr-qo"><span class="kr-qo-box is-round"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l6 7L23 2"></path></svg></span><span><b>7 days</b><small>The smallest table.</small></span></button><button class="kr-qo is-on"><span class="kr-qo-box is-round"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l6 7L23 2"></path></svg></span><span><b>30 days</b><em>recommended</em><small>Covers a billing cycle.</small></span></button><button class="kr-qo"><span class="kr-qo-box is-round"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l6 7L23 2"></path></svg></span><span><b>90 days</b><small>Matches the server logs.</small></span></button><label class="kr-qo"><span class="kr-qo-box is-round"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l6 7L23 2"></path></svg></span><input class="kr-qo-in" placeholder="Something else…"></label></div><div class="kr-q"><div class="kr-q-h"><span class="kr-q-t">Which events should it capture?</span><span class="kr-q-hint">Events · pick any</span></div><button class="kr-qo"><span class="kr-qo-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l6 7L23 2"></path></svg></span><span><b>Checkout errors</b><em>recommended</em><small>What the ticket asks for.</small></span></button><button class="kr-qo"><span class="kr-qo-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l6 7L23 2"></path></svg></span><span><b>Failed payments</b><small>Declines and timeouts.</small></span></button><label class="kr-qo"><span class="kr-qo-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l6 7L23 2"></path></svg></span><input class="kr-qo-in" placeholder="Something else…"></label></div><div class="kr-slip-act"><button class="kr-btn is-go" aria-disabled="true">Send answers</button><button class="kr-btn">You decide</button><span class="kr-slip-or">or just write your answer below</span></div></div></section>
</div>
</body>
</html>
