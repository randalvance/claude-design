<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kanban — paper</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Nunito:wght@400;600;700;800&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e4dccb;font-family:"Nunito",system-ui,sans-serif;color:#2a2219}
.page{--desk:#e4dccb;--paper:#f8f3e9;--paper-2:#efe7d6;--hover:#efe7d6;--sheet:#fffdf7;--sheet-warm:#fffaf0;--card:#fffdf8;--rail:#e4d9c1;--line:#d6cab2;--kraft:#e2c48c;--kraft-2:#cfae72;--shadow:#cdbf9f;--ink:#2a2219;--mute:#6f6252;--faint:#9a8c74;--bar:#b9a98a;--red:#c8553d;--red-2:#8f3a2a;--blue:#3b5b9a;--blue-2:#2a4070;--green:#5b8c5a;--amber:#b8792f;--highlighter:#fff0a0;--highlighter-2:#d9b84a;--tape:#ffec969e;--white:#ffffff;--panel:#f3ecdd;--deck-1:#f1eadb;--deck-2:#ebe3d1;--rule:#dfe5ee;--attn:#f0c24a;--blush:#e8a9a2;--max:#c7935a;--max-2:#d9b48a;--kind-think:#4a8f99;--kind-sub:#8b6bb3;--stamp-ground:var(--stamp-ground);--stamp-ground-soft:var(--stamp-ground-soft);--veil:var(--veil);--knob:#ffffff;--glass:#fffdf780;--on-attn:#2a2219;--ease:cubic-bezier(.2,.7,.2,1);--ease-pop:cubic-bezier(.34,1.5,.64,1);--ease-io:cubic-bezier(.45,0,.55,1);--font-serif:"Fraunces",Georgia,serif;--font-sans:"Nunito",system-ui,sans-serif;--font-hand:"Caveat",cursive;--font-mono:"Courier New",Courier,ui-monospace,monospace;min-height:100vh;box-sizing:border-box;display:flex;justify-content:center;background:var(--desk);color:var(--ink)}
/* Night: the same desk after dark. Every ground drops to a warm near-black, ink turns to cream, kraft and the signal colours shift so they keep their contrast. */
.page.night{--desk:#15120e;--paper:#211c16;--paper-2:#2b251e;--hover:#3f362a;--sheet:#2d2720;--sheet-warm:#29231c;--card:#302a22;--rail:#1a1612;--panel:#1c1813;--deck-1:#27221b;--deck-2:#221d17;--line:#4a4034;--rule:#3b4350;--kraft:#6f5530;--kraft-2:#4e3a1f;--shadow:#0c0a07;--ink:#efe6d3;--mute:#b4a68e;--faint:#857863;--bar:#5e5343;--red:#d9654c;--red-2:#a8432e;--blue:#7d9bd8;--blue-2:#3d5a94;--green:#78a876;--amber:#d6964a;--highlighter:#5c4f14;--highlighter-2:#a88f2e;--attn:#e3b53a;--blush:#7a3d36;--max:#8c6436;--max-2:#5f4425;--kind-think:#5fa9b3;--kind-sub:#a58ad0;--white:#ffffff;--tape:#ffec9640;--stamp-ground:#211c16cc;--stamp-ground-soft:#211c168c;--veil:#000000a6;--knob:#efe6d3;--glass:#fffdf714;--on-attn:#2a2219;--cork:#5a4028;--cork-2:#3a2816;color-scheme:dark}
.page.night .app::after{background:#000;mix-blend-mode:screen;opacity:.16}

button,input{font:inherit}
.pp-ic{width:16px;height:16px;flex:none}

.app{position:relative;width:100%;display:flex;background:var(--paper);min-height:100vh}
.app::after{content:"";position:absolute;inset:0;background:#fff;filter:url(#pp-grain);opacity:.35;mix-blend-mode:multiply;pointer-events:none;z-index:3}

/* rail (Paper Chat: Rail) */
.pp-rail{width:64px;flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 0 10px;background:var(--rail);border-right:1px solid var(--line);box-sizing:border-box;overflow:auto;position:sticky;top:0;height:100vh;align-self:flex-start;z-index:1}
.pp-logo{width:36px;height:36px;display:grid;place-items:center;color:var(--red);margin-bottom:6px;transform:rotate(-6deg)}
.pp-rb{all:unset;cursor:pointer;position:relative;width:54px;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mute);font-size:10px;font-weight:800;border-radius:3px;transition:transform .15s var(--ease),background .15s var(--ease)}
.pp-rb svg{width:18px;height:18px}
.pp-rb:hover{background:var(--sheet-warm);transform:translateY(-1px)}
.pp-rb.is-on{background:var(--sheet-warm);color:var(--ink);box-shadow:2px 2px 0 var(--shadow);transform:rotate(-2deg)}
.pp-rb:focus-visible{outline:2px solid var(--blue)}
.pp-rb .pp-nb{position:absolute;top:0;right:4px;transform:rotate(8deg)}
.pp-nb{min-width:16px;height:16px;padding:0 4px;border-radius:50%;background:var(--red);color:var(--white);font-size:10px;font-weight:900;display:grid;place-items:center;box-shadow:1px 1px 0 rgba(0,0,0,.2);box-sizing:border-box;flex:none}
.pp-rail .pp-sp{flex:1}

/* list page */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;z-index:1}
.top{display:flex;align-items:flex-end;gap:18px;padding:22px 28px 0;flex-wrap:wrap}
.ttl{display:flex;flex-direction:column;gap:2px;min-width:0}
.ttl h1{margin:0;font-family:var(--font-serif);font-weight:600;font-size:26px;letter-spacing:-.01em;font-variation-settings:"opsz" 48}
.ttl .sub{font-family:var(--font-hand);font-size:17px;color:var(--mute)}
.ttl .sub.is-busy{color:var(--amber)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pp-search{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;background:var(--sheet);border:1px solid var(--line);box-shadow:2px 2px 0 var(--shadow);color:var(--mute);box-sizing:border-box;width:240px;max-width:100%}
.pp-search input{all:unset;flex:1;min-width:0;font-size:13px;color:var(--ink)}
.pp-search input::placeholder{color:var(--faint);font-family:var(--font-hand);font-size:16px}
.pp-kbd{font-family:var(--font-mono);font-size:10px;color:var(--mute);border:1px solid var(--line);padding:1px 4px;white-space:nowrap}
.pp-btn{all:unset;cursor:pointer;height:32px;padding:0 12px;background:var(--blue);color:var(--white);font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:6px;box-shadow:2px 2px 0 var(--blue-2);transition:transform .15s var(--ease),background .15s var(--ease);box-sizing:border-box;white-space:nowrap}
.pp-btn:hover{transform:translateY(-1px)}
.pp-btn:focus-visible{outline:2px solid var(--ink)}
.pp-btn.ghost{background:var(--sheet);color:var(--ink);box-shadow:2px 2px 0 var(--shadow);border:1px solid var(--ink)}
.pp-btn.is-busy{background:var(--amber);box-shadow:2px 2px 0 #8a5a20}
.pp-btn.ghost.is-busy{background:var(--highlighter);box-shadow:2px 2px 0 var(--shadow)}
.spin{animation:turn .8s linear infinite}

.grid{flex:1;padding:26px 28px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:24px;align-content:start}
.bc{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:3px;box-shadow:3px 4px 0 var(--shadow);display:flex;flex-direction:column;transition:transform .15s var(--ease),box-shadow .15s var(--ease);animation:drop .28s var(--ease) both}
.bc:hover{transform:translate(-1px,-1px);box-shadow:4px 5px 0 var(--shadow)}
.bc.on{transform:translate(-2px,-2px);box-shadow:6px 7px 0 var(--shadow);border-color:var(--kraft-2)}
.hit{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:16px 16px 10px;width:100%;box-sizing:border-box;border-radius:3px 3px 0 0}
.hit:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.stamp{position:absolute;top:10px;right:12px;font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:3px 7px;border:2px solid currentColor;border-radius:3px;transform:rotate(6deg);opacity:.85;mix-blend-mode:multiply;background:var(--stamp-ground);white-space:nowrap}
.stamp.local{color:var(--mute)}
.stamp.jira{color:var(--blue)}
.stamp.github{color:var(--ink)}
.nm{font-family:var(--font-serif);font-size:17px;font-weight:600;line-height:1.2;position:relative;display:inline-block;align-self:flex-start;padding-right:80px}
.nm::before{content:"";position:absolute;inset:0 74px 0 -6px;background:var(--highlighter);transform:skewX(-6deg) rotate(-.4deg);mix-blend-mode:multiply;opacity:0;transition:opacity .12s var(--ease)}
.bc.on .nm::before{opacity:1}
.nm span{position:relative}
.src{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;color:var(--mute);margin-top:2px}
.src svg{width:13px;height:13px}
.cols{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.ct{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;background:var(--paper-2);border:1px solid var(--line);font-size:10.5px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.ct b{font-family:var(--font-hand);font-size:14px;color:var(--ink);font-weight:600;letter-spacing:0;text-transform:none}
.ct.doing{background:var(--highlighter);border-color:var(--highlighter-2)}
.wss{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.wsc{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px 0 6px;background:var(--sheet-warm);border:1px solid var(--line);font-size:12px;font-weight:700;transform:rotate(-1deg)}
.wsc:nth-child(even){transform:rotate(1deg)}
.wsc i{width:9px;height:9px;flex:none;box-shadow:1px 1px 0 rgba(0,0,0,.18)}
.wss .none{font-family:var(--font-hand);font-size:15px;color:var(--faint)}
.foot{display:flex;align-items:center;gap:8px;padding:8px 16px 14px;margin-top:auto;flex-wrap:wrap}
.sync-s{font-family:var(--font-hand);font-size:15px;color:var(--mute);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync-s.is-busy{color:var(--amber)}
.sync-s.is-new{color:var(--green)}
.foot .r{margin-left:auto;display:inline-flex;gap:8px;flex:none}
.mini{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;font-size:11.5px;font-weight:800;border:1.5px dashed var(--bar);color:var(--mute);border-radius:3px;box-sizing:border-box;transition:transform .15s var(--ease),background .15s var(--ease),color .15s var(--ease);white-space:nowrap}
.mini:hover{color:var(--ink);border-color:var(--ink);transform:translateY(-1px)}
.mini:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mini.is-busy{border-style:solid;border-color:var(--amber);color:var(--amber)}
.mini.open{border-style:solid;border-color:var(--ink);color:var(--ink);background:var(--sheet-warm);box-shadow:2px 2px 0 var(--shadow)}
.mini.open:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--shadow)}
.mini svg{width:13px;height:13px}
.pp-dashed{all:unset;cursor:pointer;font-size:11.5px;font-weight:800;color:var(--mute);border:1.5px dashed var(--bar);padding:3px 10px;border-radius:3px}
.pp-dashed:hover{color:var(--ink);border-color:var(--ink)}
.pp-dashed:focus-visible{outline:2px solid var(--blue)}
.newc{all:unset;cursor:pointer;min-height:180px;border:1.5px dashed var(--bar);border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--mute);font-family:var(--font-hand);font-size:20px;transition:transform .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease);box-sizing:border-box}
.newc:hover{transform:translateY(-2px);border-color:var(--ink);color:var(--ink)}
.newc:focus-visible{outline:2px solid var(--blue)}
.newc .plus{width:44px;height:44px;border-radius:50%;background:var(--kraft);box-shadow:1px 2px 0 var(--kraft-2);display:grid;place-items:center;color:var(--ink);transform:rotate(-7deg)}
.newc .plus svg{width:20px;height:20px}
.newc small{font-size:14px;font-family:var(--font-sans);color:var(--faint);font-weight:700}
.pp-scrap{grid-column:1/-1;font-family:var(--font-hand);font-size:22px;color:var(--mute);padding:40px 0;text-align:center;transform:rotate(-1deg)}
.demo{display:flex;align-items:center;gap:10px;justify-content:center;font-family:var(--font-hand);font-size:16px;color:var(--mute);padding:0 28px 16px;flex-wrap:wrap}

@keyframes drop{from{transform:translateY(-10px) rotate(-1deg);opacity:0}to{transform:none;opacity:1}}
@keyframes turn{to{transform:rotate(360deg)}}
@media (max-width:860px){.app{flex-direction:column}.pp-rail{position:static;height:auto;width:100%;flex-direction:row;justify-content:center;border-right:0;border-bottom:1px solid var(--line);padding:6px}.pp-rail .pp-sp{display:none}.pp-logo{margin:0 6px 0 0}.top,.grid,.demo{padding-left:16px;padding-right:16px}.top-r{margin-left:0;width:100%}.pp-search{width:100%}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</helmet>
<div class="page {{themeCls}}">
<svg width="0" height="0" style="position: absolute" aria-hidden="true"><filter id="pp-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="matrix" values="0 0 0 0 0.36 0 0 0 0 0.29 0 0 0 0 0.18 0 0 0 0.5 0"></feColorMatrix></filter></svg>
<div class="app">

  <nav class="pp-rail" aria-label="Primary">
    <div class="pp-logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><circle cx="7" cy="8" r="2.2"></circle><circle cx="12" cy="5.5" r="2.2"></circle><circle cx="17" cy="8" r="2.2"></circle><path d="M12 10c-3.5 0-6.5 3-6.5 6 0 1.8 1.3 3 3 3 1.2 0 2.2-.6 3.5-.6s2.3.6 3.5.6c1.7 0 3-1.2 3-3 0-3-3-6-6.5-6z"></path></svg></div>
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="10">
      <button class="pp-rb {{n.cls}}" aria-current="{{n.cur}}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
        <span>{{n.label}}</span>
        <sc-if value="{{n.hasBadge}}" hint-placeholder-val="{{false}}"><span class="pp-nb">{{n.badge}}</span></sc-if>
      </button>
    </sc-for>
    <span class="pp-sp"></span>
    <button class="pp-rb" onClick="{{toggleTheme}}" aria-label="{{themeLabel}}" aria-pressed="{{isNight}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{themeIcon}}"></path></svg><span>{{themeWord}}</span></button>
    <button class="pp-rb" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg><span>Settings</span></button>
  </nav>

  <main class="main">
    <header class="top">
      <div class="ttl"><h1>Kanban</h1><span class="sub {{subCls}}">{{sub}}</span></div>
      <div class="top-r">
        <label class="pp-search"><svg class="pp-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><input type="search" placeholder="Find a board or workspace" aria-label="Find a board" ref="{{qRef}}" onInput="{{onSearch}}"><span class="pp-kbd">⌘K</span></label>
        <button class="pp-btn ghost {{syncAllCls}}" onClick="{{syncAll}}" aria-busy="{{anyBusy}}"><svg class="pp-ic {{syncAllSpin}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7M21 3v6h-6"></path></svg>{{syncAllLabel}}</button>
        <button class="pp-btn"><svg class="pp-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New board</button>
      </div>
    </header>

    <section class="grid" aria-label="Boards">
      <sc-for list="{{items}}" as="b" hint-placeholder-count="6">
        <article class="bc {{b.cls}}">
          <span class="stamp {{b.type}}" aria-label="{{b.typeLabel}}">{{b.typeLabel}}</span>
          <button class="hit" onClick="{{b.open}}" aria-pressed="{{b.on}}">
            <span class="nm"><span>{{b.name}}</span></span>
            <span class="src">
              <sc-if value="{{b.isJira}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l4 4-4 4-4-4zM12 13l4 4-4 4-4-4z"></path></svg></sc-if>
              <sc-if value="{{b.isGithub}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v1M8.5 9.5l.7.7M15.5 9.5l-.7.7M9 13h6l-1 4h-4z"></path></svg></sc-if>
              <sc-if value="{{b.isLocal}}" hint-placeholder-val="{{true}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v12H4zM8 4v4M16 4v4"></path></svg></sc-if>
              <span>{{b.source}}</span>
            </span>
            <span class="cols"><sc-for list="{{b.counts}}" as="c" hint-placeholder-count="3"><span class="ct {{c.cls}}">{{c.name}} <b>{{c.n}}</b></span></sc-for></span>
            <span class="wss">
              <sc-for list="{{b.wss}}" as="w" hint-placeholder-count="2"><span class="wsc"><i style="background: {{w.color}}" aria-hidden="true"></i>{{w.name}}</span></sc-for>
              <sc-if value="{{b.noWs}}" hint-placeholder-val="{{false}}"><span class="none">no workspace yet</span></sc-if>
            </span>
          </button>
          <div class="foot">
            <span class="sync-s {{b.syncCls}}">{{b.syncText}}</span>
            <span class="r">
              <sc-if value="{{b.canSync}}" hint-placeholder-val="{{true}}"><button class="mini {{b.btnCls}}" onClick="{{b.sync}}" aria-busy="{{b.busy}}" aria-label="{{b.syncAria}}"><svg class="{{b.spin}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7M21 3v6h-6"></path></svg>{{b.btnLabel}}</button></sc-if>
              <button class="mini open" onClick="{{b.open}}">Open board</button>
            </span>
          </div>
        </article>
      </sc-for>
      <sc-if value="{{empty}}" hint-placeholder-val="{{false}}"><div class="pp-scrap">No board called “{{q}}” here</div></sc-if>
      <sc-if value="{{showNew}}" hint-placeholder-val="{{true}}"><button class="newc"><span class="plus" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>Make a new board<small>local · from Jira · from GitHub issues</small></button></sc-if>
    </section>

    <div class="demo"><span>{{demoText}}</span><button class="pp-dashed" onClick="{{reset}}">Reset demo</button></div>
  </main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"paper","options":["paper","night"]},"$preview":{"width":1440,"height":900}}'>
const NAV = [
  { id: 'sessions', label: 'Sessions', icon: 'M21 12a8 8 0 0 1-11.6 7.1L4 21l1.4-4.9A8 8 0 1 1 21 12z', badge: 1 },
  { id: 'agents', label: 'Agents', icon: 'M4 8h16v12H4zM12 8V4M8 14h.01M16 14h.01M2 12h2M20 12h2' },
  { id: 'skills', label: 'Skills', icon: 'M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2zM19 15l1 2 2 1-2 1-1 2-1-2-2-1 2-1z' },
  { id: 'workspaces', label: 'Workspaces', icon: 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z' },
  { id: 'memory', label: 'Memory', icon: 'M12 3a4 4 0 0 0-4 4v1a4 4 0 0 0-3 3.9 4 4 0 0 0 1 2.6V17a3 3 0 0 0 3 3h6a3 3 0 0 0 3-3v-2.5a4 4 0 0 0 1-2.6A4 4 0 0 0 16 8V7a4 4 0 0 0-4-4z' },
  { id: 'mcps', label: 'MCPs', icon: 'M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0zM12 17v4' },
  { id: 'workflows', label: 'Workflows', icon: 'M6 3v12M18 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM18 9a9 9 0 0 1-9 9' },
  { id: 'kanban', label: 'Kanban', icon: 'M4 4h4v16H4zM10 4h4v10h-4zM16 4h4v7h-4z' },
  { id: 'prs', label: 'PRs', icon: 'M6 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM18 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 9v6M18 15V9a3 3 0 0 0-3-3h-3M13 3l-3 3 3 3', badge: 7 },
  { id: 'bg', label: 'Backgr.', icon: 'M21 12a9 9 0 1 1-3-6.7M21 3v6h-6' }
];
const WS = { lighthouse: { name: 'Lighthouse Web', color: '#5b8c5a' }, orbit: { name: 'Orbit Billing', color: '#c8553d' }, fleet: { name: 'Fleet Infra', color: '#b8792f' }, atlas: { name: 'Atlas Docs', color: '#3b5b9a' }, harbor: { name: 'Harbor Mobile', color: '#8b6bb3' }, kiln: { name: 'Kiln Data', color: '#4a8f99' } };
const BOARDS = [
  { id: 'lighthouse-q4', name: 'Lighthouse Q4', type: 'local', source: 'local · lives on this machine', wss: ['lighthouse'], counts: [11, 4, 8], synced: null },
  { id: 'billing', name: 'Billing migration', type: 'jira', source: 'ORB · jira.example.com', wss: ['orbit', 'fleet'], counts: [18, 6, 17], synced: '4 min ago', fresh: 0 },
  { id: 'chores', name: 'Platform chores', type: 'github', source: 'fleet/infra · issues', wss: ['fleet'], counts: [7, 2, 3], synced: '12 min ago', fresh: 0 },
  { id: 'harbor', name: 'Harbor 1.0', type: 'jira', source: 'HRB · jira.example.com', wss: ['harbor'], counts: [14, 5, 11], synced: '1 h ago', fresh: 3 },
  { id: 'docs', name: 'Docs backlog', type: 'local', source: 'local · lives on this machine', wss: ['atlas'], counts: [5, 1, 1], synced: null },
  { id: 'kiln', name: 'Kiln ingest bugs', type: 'github', source: 'kiln/pipelines · issues', wss: [], counts: [6, 2, 1], synced: 'yesterday', fresh: 5 }
];
const TYPE_LABEL = { local: 'Local', jira: 'Jira', github: 'GitHub' };
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');

class Component extends DCLogic {
  state = { q: '', sel: null, syncing: {}, done: {}, allBusy: false };
  timers = [];
  later(fn, ms) { this.timers.push(setTimeout(fn, ms)); }
  startSync(id) {
    if (this.state.syncing[id]) return;
    this.setState({ syncing: { ...this.state.syncing, [id]: true } });
    this.later(() => {
      const st = this.state;
      const syncing = { ...st.syncing }; delete syncing[id];
      this.setState({ syncing, done: { ...st.done, [id]: true } });
    }, 1400 + Math.random() * 800);
  }
  // Theme: the "theme" prop picks the default (paper by day, night in the dark); the moon button in the rail flips it for this view.
  themeVals() {
    const night = this.state.night ?? ((this.props.theme ?? 'paper') === 'night');
    return { themeCls: night ? 'night' : '', isNight: night, themeWord: night ? 'Day' : 'Night',
      themeLabel: night ? 'Switch to the paper theme' : 'Switch to the night theme',
      themeIcon: night ? 'M12 4V2M12 22v-2M4 12H2M22 12h-2M5.6 5.6L4.2 4.2M19.8 19.8l-1.4-1.4M5.6 18.4l-1.4 1.4M19.8 4.2l-1.4 1.4M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z' : 'M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z',
      toggleTheme: () => this.setState({ night: !night }) };
  }
  renderVals() { return { ...this.themeVals(), ...this.renderVals0() }; }
  renderVals0() {
    const st = this.state;
    const q = st.q.trim().toLowerCase();
    const list = BOARDS.filter((b) => !q || b.name.toLowerCase().includes(q) || b.type.includes(q) || b.wss.some((w) => WS[w].name.toLowerCase().includes(q)));
    const synced = BOARDS.filter((b) => b.type !== 'local');
    const busyN = Object.keys(st.syncing).length;
    const opened = BOARDS.find((b) => b.id === st.sel);
    const anyBusy = busyN > 0;
    return {
      nav: NAV.map((n) => ({ ...n, cls: n.id === 'kanban' ? 'is-on' : '', cur: n.id === 'kanban' ? 'page' : false, hasBadge: !!n.badge, badge: n.badge || '' })),
      sub: anyBusy ? 'syncing ' + plural(busyN, 'board') + '…' : BOARDS.length + ' boards · ' + BOARDS.filter((b) => b.type === 'jira').length + ' from Jira · ' + BOARDS.filter((b) => b.type === 'github').length + ' from GitHub · ' + BOARDS.filter((b) => b.type === 'local').length + ' local',
      subCls: anyBusy ? 'is-busy' : '',
      qRef: (el) => { if (el) this.q = el; },
      onSearch: (e) => this.setState({ q: e.currentTarget.value, sel: null }),
      q: st.q,
      anyBusy,
      syncAllCls: anyBusy ? 'is-busy' : '',
      syncAllSpin: anyBusy ? 'spin' : '',
      syncAllLabel: anyBusy ? 'Syncing ' + busyN + '…' : 'Sync all',
      syncAll: () => { synced.forEach((b, i) => this.later(() => this.startSync(b.id), i * 250)); },
      items: list.map((b) => {
        const busy = !!st.syncing[b.id];
        const done = !!st.done[b.id];
        const canSync = b.type !== 'local';
        const syncText = !canSync ? 'local · nothing to sync' : busy ? 'pulling ' + (b.type === 'jira' ? 'tickets from Jira' : 'issues from GitHub') + '…' : done ? 'synced just now · up to date' : 'synced ' + b.synced + (b.fresh ? ' · ' + b.fresh + ' new since' : '');
        return {
          name: b.name, type: b.type, typeLabel: TYPE_LABEL[b.type], source: b.source,
          isJira: b.type === 'jira', isGithub: b.type === 'github', isLocal: b.type === 'local',
          counts: [{ name: 'To do', n: b.counts[0], cls: '' }, { name: 'Doing', n: b.counts[1], cls: 'doing' }, { name: 'Done', n: b.counts[2], cls: '' }],
          wss: b.wss.map((w) => WS[w]), noWs: b.wss.length === 0,
          on: st.sel === b.id, cls: st.sel === b.id ? 'on' : '',
          open: () => this.setState({ sel: b.id }),
          canSync, busy, syncText,
          syncCls: busy ? 'is-busy' : done ? 'is-new' : '',
          btnCls: busy ? 'is-busy' : '', spin: busy ? 'spin' : '',
          btnLabel: busy ? 'Syncing…' : 'Sync',
          syncAria: 'Sync ' + b.name + ' with ' + TYPE_LABEL[b.type],
          sync: () => this.startSync(b.id)
        };
      }),
      empty: list.length === 0,
      showNew: !q,
      demoText: opened ? 'Opened ' + opened.name + ' · in the app this shows the cork board (next artboard down)' : 'Sync pulls tickets and issues in; Sync all does every Jira and GitHub board · click a board to open it',
      reset: () => { this.timers.forEach(clearTimeout); this.timers = []; if (this.q) this.q.value = ''; this.setState({ q: '', sel: null, syncing: {}, done: {}, allBusy: false }); }
    };
  }
}
</script>
