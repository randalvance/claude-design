<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Popover — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Nunito:wght@400;600;700;800&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-sans);padding:16px;box-sizing:border-box}
.pv{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.pv-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.pv-l{font-family:var(--font-hand);font-size:15px;color:var(--mute);margin:0}

</style>
</head>
<body class="pp-root">
<div style="padding:12px 8px 4px"><div class="pp-pop" role="dialog" aria-label="Model and effort">
<div class="pp-pop-h"><span>Model</span></div>
<button class="pp-mrow is-sel" aria-pressed="true"><span class="pp-box" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></span><span>Sonnet 5.5</span><span class="pp-mdesc">Fast and capable</span></button>
<button class="pp-mrow" aria-pressed="false"><span class="pp-box" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></span><span>Fable 5.1</span><span class="pp-mdesc">Most intelligent</span></button>
<button class="pp-mrow" aria-pressed="false"><span class="pp-box" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></span><span>Opus 5.5</span><span class="pp-mdesc">Deep reasoning</span></button>
<div class="pp-pop-h" style="margin-top:8px"><span>Effort</span><span class="pp-val">High <span class="pp-mode">· model default</span></span></div>
<div class="pp-efs" role="group" aria-label="Effort level"><button class="pp-ef" aria-pressed="false">LOW</button><button class="pp-ef" aria-pressed="false">MED</button><button class="pp-ef is-on is-def" aria-pressed="true">HIGH</button><button class="pp-ef" aria-pressed="false">X-HIGH</button><button class="pp-ef" aria-pressed="false">MAX</button></div>
<div class="pp-adapt"><span>Thinking is adaptive. Effort sets the ceiling; the model default for Sonnet 5.5 is High.</span></div>
</div></div>
</body>
</html>
