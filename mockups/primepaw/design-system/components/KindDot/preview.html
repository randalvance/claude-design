<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KindDot — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Nunito:wght@400;600;700;800&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-sans);padding:16px;box-sizing:border-box}
.pv{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.pv-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.pv-l{font-family:var(--font-hand);font-size:15px;color:var(--mute);margin:0}

</style>
</head>
<body class="pp-root">
<div class="pv" style="align-items:center;gap:24px;padding:4px 10px">
<span class="pv-col" style="align-items:center"><i class="pp-dot is-think"></i><span class="pv-l">think</span></span>
<span class="pv-col" style="align-items:center"><i class="pp-dot is-read"></i><span class="pv-l">read</span></span>
<span class="pv-col" style="align-items:center"><i class="pp-dot is-bash"></i><span class="pv-l">bash</span></span>
<span class="pv-col" style="align-items:center"><i class="pp-dot is-edit"></i><span class="pv-l">edit</span></span>
<span class="pv-col" style="align-items:center"><i class="pp-dot is-ask"></i><span class="pv-l">ask</span></span>
<span class="pv-col" style="align-items:center"><i class="pp-dot is-sub"></i><span class="pv-l">sub</span></span>
<span class="pv-col" style="align-items:center"><i class="pp-dot is-say"></i><span class="pv-l">say</span></span>
<span class="pv-col" style="align-items:center"><i class="pp-dot is-err"></i><span class="pv-l">err</span></span>
<span class="pv-col" style="align-items:center"><i class="pp-dot is-bash is-run"></i><span class="pv-l">running</span></span>
</div>
</body>
</html>
