<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SearchField — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Nunito:wght@400;600;700;800&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-sans);padding:16px;box-sizing:border-box}
.pv{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.pv-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.pv-l{font-family:var(--font-hand);font-size:15px;color:var(--mute);margin:0}

</style>
</head>
<body class="pp-root">
<div class="pv-col" style="width:300px;gap:8px">
<div style="display:flex;gap:8px"><label class="pp-search"><svg class="pp-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><input type="search" placeholder="Search sessions" aria-label="Search sessions"><span class="pp-kbd">⌘K</span></label><button class="pp-btn">New</button></div>
<div style="display:flex;gap:8px"><button class="pp-filt" style="flex:1" aria-haspopup="listbox"><span style="flex:1;text-align:left">All workspaces</span><svg class="pp-ic" style="width:14px;height:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button><button class="pp-filt" aria-pressed="false">All</button><button class="pp-filt is-on" aria-pressed="true">Active</button></div>
</div>
</body>
</html>
