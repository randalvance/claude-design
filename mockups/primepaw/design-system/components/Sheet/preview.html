<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sheet — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Nunito:wght@400;600;700;800&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-sans);padding:16px;box-sizing:border-box}
.pv{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.pv-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.pv-l{font-family:var(--font-hand);font-size:15px;color:var(--mute);margin:0}

</style>
</head>
<body class="pp-root">
<div class="pv">
<div class="pv-col"><p class="pv-l">sheet</p><div class="pp-sheet" style="width:200px;height:110px"></div></div>
<div class="pv-col"><p class="pv-l">card (composer, popover)</p><div class="pp-card" style="width:200px;height:110px"></div></div>
<div class="pv-col"><p class="pv-l">card, focused</p><div class="pp-card is-focus" style="width:200px;height:110px"></div></div>
<div class="pv-col"><p class="pv-l">deck (two sheets behind)</p><div class="pp-deck" style="width:200px"><div class="pp-sheet" style="height:110px;position:relative;z-index:1"></div></div></div>
</div>
</body>
</html>
