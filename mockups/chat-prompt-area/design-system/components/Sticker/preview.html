<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sticker — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Nunito:wght@400;600;700;800&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-sans);padding:16px;box-sizing:border-box}
.pv{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.pv-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.pv-l{font-family:var(--font-hand);font-size:15px;color:var(--mute);margin:0}

</style>
</head>
<body class="pp-root">
<div class="pv" style="align-items:center;padding:6px 10px">
<span class="pp-sticker"><i aria-hidden="true"></i>Idle</span>
<span class="pp-sticker is-busy"><i aria-hidden="true"></i>Working</span>
<span class="pp-sticker is-attn"><i aria-hidden="true"></i>Needs review</span>
<span class="pp-nb">7</span>
<span class="pp-nb is-row">1</span>
<span class="pp-attn" aria-label="Needs attention">!</span>
<span class="pp-done">Done</span>
<span class="pp-subn">2</span>
</div>
</body>
</html>
