<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Composer — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Nunito:wght@400;600;700;800&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-sans);padding:16px;box-sizing:border-box}
.pv{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.pv-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.pv-l{font-family:var(--font-hand);font-size:15px;color:var(--mute);margin:0}

</style>
</head>
<body class="pp-root">
<div style="display:flex;flex-direction:column;gap:28px;padding:8px 10px 0">
<div class="c1" style="width:620px"><div class="pp-card">
<div class="pp-ed"><label class="pp-sr" for="ta-c1">Message the agent</label><textarea id="ta-c1" class="pp-ta" rows="2" placeholder="Message the agent…"></textarea></div>
<div class="pp-bar"><div class="pp-tools">
<span class="pp-tool"><button class="pp-mbtn" aria-haspopup="dialog" aria-expanded="false"><span>Sonnet 5.5</span><span class="pp-ebars" aria-hidden="true"><i class="is-on" style="height:4px"></i><i class="is-on" style="height:6px"></i><i class="is-on" style="height:8px"></i><i class="" style="height:10px"></i><i class="" style="height:12px"></i></span></button></span>
<span class="pp-gauge" role="img" aria-label="Context window: 69 percent left"><svg class="pp-g" viewBox="0 0 40 40" aria-hidden="true"><circle class="pp-g-track" cx="20" cy="20" r="14" transform="rotate(135 20 20)"></circle><circle class="pp-g-fill is-ok" cx="20" cy="20" r="14" transform="rotate(135 20 20)" style="stroke-dasharray: 45.52 87.96"></circle><line class="pp-needle" x1="20" y1="20" x2="30.5" y2="20" style="transform: rotate(321deg)"></line><circle class="pp-hub" cx="20" cy="20" r="2"></circle><text x="6" y="36">E</text><text x="30" y="36">F</text></svg><span>69% left</span></span>
<button class="pp-stampbtn" role="switch" aria-checked="true" aria-label="YOLO mode">YOLO<span class="pp-stamp" aria-hidden="true">YOLO</span></button>
<span class="pp-dirtag"><svg class="pp-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Lighthouse Web</span>
</div><span class="pp-hint" aria-hidden="true">Enter to send</span><button class="pp-send" aria-label="Send message"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></button></div>
</div></div>
<div class="c2" style="width:620px"><div class="pp-card is-focus">
<div class="pp-ed"><label class="pp-sr" for="ta-c2">Message the agent</label><textarea id="ta-c2" class="pp-ta" rows="2" placeholder="Message the agent…">Open an issue for synced cards showing markdown as plain text.</textarea></div>
<div class="pp-bar"><div class="pp-tools">
<span class="pp-tool"><button class="pp-mbtn" aria-haspopup="dialog" aria-expanded="false"><span>Sonnet 5.5</span><span class="pp-ebars" aria-hidden="true"><i class="is-on" style="height:4px"></i><i class="is-on" style="height:6px"></i><i class="is-on" style="height:8px"></i><i class="" style="height:10px"></i><i class="" style="height:12px"></i></span></button></span>
<span class="pp-gauge" role="img" aria-label="Context window: 69 percent left"><svg class="pp-g" viewBox="0 0 40 40" aria-hidden="true"><circle class="pp-g-track" cx="20" cy="20" r="14" transform="rotate(135 20 20)"></circle><circle class="pp-g-fill is-ok" cx="20" cy="20" r="14" transform="rotate(135 20 20)" style="stroke-dasharray: 45.52 87.96"></circle><circle class="pp-g-draft" cx="20" cy="20" r="14" transform="rotate(135 20 20)" style="stroke-dasharray: 6.60 87.96; stroke-dashoffset: -38.92"></circle><line class="pp-needle" x1="20" y1="20" x2="30.5" y2="20" style="transform: rotate(321deg)"></line><circle class="pp-hub" cx="20" cy="20" r="2"></circle><text x="6" y="36">E</text><text x="30" y="36">F</text></svg><span>69% left</span></span>
<button class="pp-stampbtn" role="switch" aria-checked="true" aria-label="YOLO mode">YOLO<span class="pp-stamp" aria-hidden="true">YOLO</span></button>
<span class="pp-dirtag"><svg class="pp-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Lighthouse Web</span>
</div><span class="pp-hint" aria-hidden="true">Enter to send</span><button class="pp-send is-ready" aria-label="Send message"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></button></div>
</div></div>
<div class="c3 is-max" style="width:620px"><div class="pp-card is-max"><span class="pp-maxstamp" aria-hidden="true">MAX</span>
<div class="pp-ed"><label class="pp-sr" for="ta-c3 is-max">Message the agent</label><textarea id="ta-c3 is-max" class="pp-ta" rows="2" placeholder="Max effort is on. Describe the hard problem…"></textarea></div>
<div class="pp-bar"><div class="pp-tools">
<span class="pp-tool"><button class="pp-mbtn" aria-haspopup="dialog" aria-expanded="false"><span>Fable 5.1</span><span class="pp-ebars" aria-hidden="true"><i class="is-on" style="height:4px"></i><i class="is-on" style="height:6px"></i><i class="is-on" style="height:8px"></i><i class="is-on" style="height:10px"></i><i class="is-on" style="height:12px"></i></span></button></span>
<span class="pp-gauge" role="img" aria-label="Context window: 69 percent left"><svg class="pp-g" viewBox="0 0 40 40" aria-hidden="true"><circle class="pp-g-track" cx="20" cy="20" r="14" transform="rotate(135 20 20)"></circle><circle class="pp-g-fill is-ok" cx="20" cy="20" r="14" transform="rotate(135 20 20)" style="stroke-dasharray: 45.52 87.96"></circle><line class="pp-needle" x1="20" y1="20" x2="30.5" y2="20" style="transform: rotate(321deg)"></line><circle class="pp-hub" cx="20" cy="20" r="2"></circle><text x="6" y="36">E</text><text x="30" y="36">F</text></svg><span>69% left</span></span>
<button class="pp-stampbtn" role="switch" aria-checked="true" aria-label="YOLO mode">YOLO<span class="pp-stamp" aria-hidden="true">YOLO</span></button>
<span class="pp-dirtag"><svg class="pp-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Lighthouse Web</span>
</div><span class="pp-hint" aria-hidden="true">Enter to send</span><button class="pp-send" aria-label="Send message"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></button></div>
</div></div>
</div>
</body>
