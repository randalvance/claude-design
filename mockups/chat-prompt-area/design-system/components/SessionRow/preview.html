<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SessionRow — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Nunito:wght@400;600;700;800&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-sans);padding:16px;box-sizing:border-box}
.pv{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.pv-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.pv-l{font-family:var(--font-hand);font-size:15px;color:var(--mute);margin:0}

</style>
</head>
<body class="pp-root">
<div class="pv-col" style="width:300px"><div class="pp-rows">
<button class="pp-row"><span class="pp-src" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="8" width="16" height="12" rx="3"></rect><path d="M12 8V4M8 14h.01M16 14h.01"></path></svg></span><span class="pp-t">Generate app icon</span><span class="pp-dur">2m 50s</span></button>
<button class="pp-row is-on" aria-current="true"><span class="pp-src" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="8" width="16" height="12" rx="3"></rect><path d="M12 8V4M8 14h.01M16 14h.01"></path></svg></span><span class="pp-t">Issue Creator</span><span class="pp-subn" title="Subagents">2</span><span class="pp-dur">6h 06m</span></button>
<button class="pp-row is-busy"><span class="pp-nb is-row" aria-label="Needs attention">1</span><span class="pp-src" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="8" width="16" height="12" rx="3"></rect><path d="M12 8V4M8 14h.01M16 14h.01"></path></svg></span><span class="pp-t">ORB-272 - Browser telemetry</span><svg class="pp-pin" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 12L4 4h8zM12 12l8-8v8zM12 12l8 8h-8zM12 12l-8 8v-8z"></path></svg><span class="pp-dur">1h 53m</span></button>
<button class="pp-row"><span class="pp-src" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="8" width="16" height="12" rx="3"></rect><path d="M12 8V4M8 14h.01M16 14h.01"></path></svg></span><span class="pp-done">Done</span><span class="pp-t">Move worker pool to private subnets</span><span class="pp-dur">34s</span></button>
<button class="pp-row"><span class="pp-src" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="8" width="16" height="12" rx="3"></rect><path d="M12 8V4M8 14h.01M16 14h.01"></path></svg></span><span class="pp-t">Support answers draft</span><span class="pp-dur">—</span></button>
</div></div>
</body>
</html>
