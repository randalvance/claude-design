<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FolderTab — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Nunito:wght@400;600;700;800&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-sans);padding:16px;box-sizing:border-box}
.pv{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.pv-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.pv-l{font-family:var(--font-hand);font-size:15px;color:var(--mute);margin:0}

</style>
</head>
<body class="pp-root">
<div class="pv">
<div class="pv-col" style="width:300px">
<section class="pp-folder"><button class="pp-folder-tab" aria-expanded="true"><svg class="pp-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg><i class="pp-swatch" style="background: var(--green)" aria-hidden="true"></i><span class="pp-nm">Lighthouse Web</span><span class="pp-cnt">3</span></button>
<div class="pp-folder-body"><div class="pp-folder-in"><div class="pp-rows">
<button class="pp-row"><span class="pp-src" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="8" width="16" height="12" rx="3"></rect><path d="M12 8V4M8 14h.01M16 14h.01"></path></svg></span><span class="pp-t">nightly digest: curator drafts the changelog</span><span class="pp-dur">22m 21s</span></button>
<button class="pp-row is-on" aria-current="true"><span class="pp-src" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="8" width="16" height="12" rx="3"></rect><path d="M12 8V4M8 14h.01M16 14h.01"></path></svg></span><span class="pp-t">Issue Creator</span><span class="pp-subn" title="Subagents">2</span><span class="pp-dur">6h 06m</span></button>
<button class="pp-row is-busy"><span class="pp-src" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="8" width="16" height="12" rx="3"></rect><path d="M12 8V4M8 14h.01M16 14h.01"></path></svg></span><span class="pp-t">Rebase feature onto main and release-2.4</span><svg class="pp-pin" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 12L4 4h8zM12 12l8-8v8zM12 12l8 8h-8zM12 12l-8 8v-8z"></path></svg><span class="pp-dur">4m 55s</span></button>
</div></div></div></section>
<section class="pp-folder is-closed"><button class="pp-folder-tab" aria-expanded="false"><svg class="pp-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg><i class="pp-swatch" style="background: var(--red)" aria-hidden="true"></i><span class="pp-nm">Orbit Billing</span><span class="pp-attn" aria-label="Needs attention">!</span><span class="pp-cnt">13</span></button>
<div class="pp-folder-body"><div class="pp-folder-in"><div class="pp-rows"><button class="pp-row"><span class="pp-t">Sticky checkout sessions</span></button></div></div></div></section>
</div></div>
</body>
</html>
