<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gauge — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Nunito:wght@400;600;700;800&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-sans);padding:16px;box-sizing:border-box}
.pv{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.pv-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.pv-l{font-family:var(--font-hand);font-size:15px;color:var(--mute);margin:0}

</style>
</head>
<body class="pp-root">
<div class="pv" style="align-items:center;gap:28px">
<div class="pv-col"><p class="pv-l">plenty</p><span class="pp-gauge" role="img" aria-label="Context window: 69 percent left"><svg class="pp-g" viewBox="0 0 40 40" aria-hidden="true"><circle class="pp-g-track" cx="20" cy="20" r="14" transform="rotate(135 20 20)"></circle><circle class="pp-g-fill is-ok" cx="20" cy="20" r="14" transform="rotate(135 20 20)" style="stroke-dasharray: 45.52 87.96"></circle><line class="pp-needle" x1="20" y1="20" x2="30.5" y2="20" style="transform: rotate(321deg)"></line><circle class="pp-hub" cx="20" cy="20" r="2"></circle><text x="6" y="36">E</text><text x="30" y="36">F</text></svg><span>69% left</span></span></div>
<div class="pv-col"><p class="pv-l">with a draft ghost</p><span class="pp-gauge" role="img" aria-label="Context window: 69 percent left"><svg class="pp-g" viewBox="0 0 40 40" aria-hidden="true"><circle class="pp-g-track" cx="20" cy="20" r="14" transform="rotate(135 20 20)"></circle><circle class="pp-g-fill is-ok" cx="20" cy="20" r="14" transform="rotate(135 20 20)" style="stroke-dasharray: 45.52 87.96"></circle><circle class="pp-g-draft" cx="20" cy="20" r="14" transform="rotate(135 20 20)" style="stroke-dasharray: 7.92 87.96; stroke-dashoffset: -37.60"></circle><line class="pp-needle" x1="20" y1="20" x2="30.5" y2="20" style="transform: rotate(321deg)"></line><circle class="pp-hub" cx="20" cy="20" r="2"></circle><text x="6" y="36">E</text><text x="30" y="36">F</text></svg><span>69% left</span></span></div>
<div class="pv-col"><p class="pv-l">getting low</p><span class="pp-gauge" role="img" aria-label="Context window: 31 percent left"><svg class="pp-g" viewBox="0 0 40 40" aria-hidden="true"><circle class="pp-g-track" cx="20" cy="20" r="14" transform="rotate(135 20 20)"></circle><circle class="pp-g-fill is-mid" cx="20" cy="20" r="14" transform="rotate(135 20 20)" style="stroke-dasharray: 20.45 87.96"></circle><line class="pp-needle" x1="20" y1="20" x2="30.5" y2="20" style="transform: rotate(219deg)"></line><circle class="pp-hub" cx="20" cy="20" r="2"></circle><text x="6" y="36">E</text><text x="30" y="36">F</text></svg><span>31% left</span></span></div>
<div class="pv-col"><p class="pv-l">nearly empty</p><span class="pp-gauge" role="img" aria-label="Context window: 9 percent left"><svg class="pp-g" viewBox="0 0 40 40" aria-hidden="true"><circle class="pp-g-track" cx="20" cy="20" r="14" transform="rotate(135 20 20)"></circle><circle class="pp-g-fill is-low" cx="20" cy="20" r="14" transform="rotate(135 20 20)" style="stroke-dasharray: 5.94 87.96"></circle><line class="pp-needle" x1="20" y1="20" x2="30.5" y2="20" style="transform: rotate(159deg)"></line><circle class="pp-hub" cx="20" cy="20" r="2"></circle><text x="6" y="36">E</text><text x="30" y="36">F</text></svg><span>9% left</span></span></div>
</div>
</body>
</html>
