<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orbit ring loader</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.timer{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;font-weight:500;color:#6B7080;font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0}
.ring{position:absolute;inset:0;border-radius:50%;border:2.5px solid #E3E6EC;border-top-color:var(--accent);animation:spin .9s linear infinite}
.orbit{position:absolute;inset:-5px;animation:spin 2.2s linear infinite reverse}
.orbit span{position:absolute;top:0;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--accent)}
.core{position:absolute;inset:10px;border-radius:50%;background:var(--accent);animation:breathe 1.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(.6);opacity:.4}50%{transform:scale(1);opacity:1}}
.slot{position:relative;height:24px;width:220px}
.m{position:absolute;left:0;top:0;white-space:nowrap;line-height:24px;font-size:15px;color:#3A3E48;opacity:0;filter:blur(8px);transform:scale(1.06);transform-origin:left center;transition:opacity .7s ease,filter .7s ease,transform .7s ease}
.m.in{opacity:1;filter:blur(0);transform:none}
.m.out{opacity:0;filter:blur(6px);transform:scale(.94)}
</style>
</helmet>
<div style="--accent: {{accent}}; width: 560px; height: 320px; box-sizing: border-box; padding: 32px; display: flex; flex-direction: column; gap: 24px; background: #FAFAFB; font-family: 'DM Sans', system-ui, sans-serif; color: #1B1D22">
<div style="align-self: flex-end; max-width: 360px; background: #1B1D22; color: #FFFFFF; padding: 12px 16px; border-radius: 18px 18px 4px 18px; font-size: 15px; line-height: 1.4">Plan a 3-day trip to Kyoto.</div>
<div role="status" aria-live="polite" style="display: flex; gap: 16px; align-items: center; padding-left: 4px">
<div style="position: relative; width: 28px; height: 28px; flex-shrink: 0">
<div class="ring"></div>
<div class="orbit"><span></span></div>
<div class="core"></div>
</div>
<div class="slot">
<sc-for list="{{items}}" as="item" hint-placeholder-count="5">
<span class="m {{item.cls}}">{{item.t}}</span>
</sc-for>
</div>
<span class="timer" aria-hidden="true">{{elapsed}}</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0F9D74","options":["#0F9D74","#3B5BFD","#E8590C","#8B3DFF"]},"interval":{"editor":"int","default":2400,"min":800,"max":6000,"step":100,"unit":"ms"},"$preview":{"width":560,"height":320}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { i: 0 }; }
componentDidMount() { this.start = Date.now(); this.clock = setInterval(() => this.setState({ now: Date.now() }), 100); this.t = setInterval(() => this.setState((s) => ({ i: s.i + 1 })), this.props.interval ?? 2400); }
componentWillUnmount() { clearInterval(this.t); clearInterval(this.clock); }
fmt(ms) { const s = ms / 1000; if (s < 60) return s.toFixed(1) + 's'; const m = Math.floor(s / 60), r = Math.floor(s % 60); return m + 'm ' + String(r).padStart(2, '0') + 's'; }
renderVals() {
const msgs = ['Packing the bags…', 'Reminiscing…', 'Checking train times…', 'Finding hidden temples…', 'Folding the map…'];
const i = this.state.i, n = msgs.length, cur = i % n, prev = (i - 1 + n) % n;
return {
elapsed: this.fmt(Date.now() - (this.start || Date.now())),
accent: this.props.accent ?? '#0F9D74',
items: msgs.map((t, k) => ({ t, cls: k === cur ? 'in' : (i > 0 && k === prev ? 'out' : '') }))
};
}
}
</script>
</body>
</html>
