<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Letter wave loader</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.timer{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;font-weight:500;color:#6B7080;font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0}
.l{display:inline-block;animation:wave 1.6s ease-in-out infinite}
@keyframes wave{0%,40%,100%{transform:translateY(0);color:#3A3E48}20%{transform:translateY(-6px);color:var(--accent)}}
.ping{position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);animation:ping 1.6s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.7);opacity:0}}
</style>
</helmet>
<div style="--accent: {{accent}}; width: 560px; height: 320px; box-sizing: border-box; padding: 32px; display: flex; flex-direction: column; gap: 24px; background: #FAFAFB; font-family: 'DM Sans', system-ui, sans-serif; color: #1B1D22">
<div style="align-self: flex-end; max-width: 360px; background: #1B1D22; color: #FFFFFF; padding: 12px 16px; border-radius: 18px 18px 4px 18px; font-size: 15px; line-height: 1.4">Write a haiku about Monday mornings.</div>
<div role="status" aria-live="polite" aria-label="{{label}}" style="display: flex; gap: 14px; align-items: center">
<div style="position: relative; width: 32px; height: 32px; flex-shrink: 0">
<div class="ping"></div>
<div style="position: absolute; inset: 0; border-radius: 50%; background: {{accent}}; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L14 10 L22 12 L14 14 L12 22 L10 14 L2 12 L10 10 Z" fill="#FFFFFF"></path></svg>
</div>
</div>
<div aria-hidden="true" style="font-size: 16px; font-weight: 500; line-height: 24px; white-space: nowrap; padding-top: 6px; width: 250px">
<sc-for list="{{letters}}" as="l" hint-placeholder-count="14"><span class="l" style="animation-delay: {{l.d}}">{{l.c}}</span></sc-for>
</div>
<span class="timer" aria-hidden="true" style="padding-top: 6px">{{elapsed}}</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E8590C","options":["#E8590C","#3B5BFD","#0F9D74","#8B3DFF"]},"interval":{"editor":"int","default":3200,"min":1200,"max":8000,"step":100,"unit":"ms"},"$preview":{"width":560,"height":320}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { i: 0 }; }
componentDidMount() { this.start = Date.now(); this.clock = setInterval(() => this.setState({ now: Date.now() }), 100); this.t = setInterval(() => this.setState((s) => ({ i: s.i + 1 })), this.props.interval ?? 3200); }
componentWillUnmount() { clearInterval(this.t); clearInterval(this.clock); }
fmt(ms) { const s = ms / 1000; if (s < 60) return s.toFixed(1) + 's'; const m = Math.floor(s / 60), r = Math.floor(s % 60); return m + 'm ' + String(r).padStart(2, '0') + 's'; }
renderVals() {
const msgs = ['Counting syllables…', 'Staring out the window…', 'Brewing coffee…', 'Reminiscing…', 'Finding the right word…'];
const msg = msgs[this.state.i % msgs.length];
return {
elapsed: this.fmt(Date.now() - (this.start || Date.now())),
accent: this.props.accent ?? '#E8590C',
label: msg,
letters: msg.split('').map((c, k) => ({ c: c === ' ' ? ' ' : c, d: (k * 0.05).toFixed(2) + 's' }))
};
}
}
</script>
</body>
</html>
