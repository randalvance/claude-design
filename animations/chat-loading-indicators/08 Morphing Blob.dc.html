<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Morphing blob loader</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.timer{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;font-weight:500;color:#6B7080;font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0}
.blob{position:absolute;inset:0;background:var(--accent);animation:morph 3.2s ease-in-out infinite,turn 6s linear infinite}
.blob.ghost{opacity:.25;inset:-5px;animation:morph 3.2s ease-in-out infinite reverse,turn 9s linear infinite reverse}
@keyframes morph{0%,100%{border-radius:42% 58% 63% 37% / 41% 44% 56% 59%}25%{border-radius:68% 32% 41% 59% / 55% 62% 38% 45%}50%{border-radius:35% 65% 52% 48% / 66% 37% 63% 34%}75%{border-radius:57% 43% 34% 66% / 38% 58% 42% 62%}}
@keyframes turn{to{transform:rotate(360deg)}}
.slot{position:relative;height:24px;width:300px}
.m{position:absolute;left:0;top:0;white-space:nowrap;line-height:24px;font-size:15px;font-weight:500;color:#3A3E48;opacity:0;letter-spacing:.35em;transition:opacity .7s ease,letter-spacing .8s cubic-bezier(.2,.8,.2,1)}
.m.in{opacity:1;letter-spacing:0}
.m.out{opacity:0;letter-spacing:-.08em;transition:opacity .4s ease,letter-spacing .4s ease}
</style>
</helmet>
<div style="--accent: {{accent}}; width: 560px; height: 320px; box-sizing: border-box; padding: 32px; display: flex; flex-direction: column; gap: 24px; background: #FAFAFB; font-family: 'DM Sans', system-ui, sans-serif; color: #1B1D22">
<div style="align-self: flex-end; max-width: 360px; background: #1B1D22; color: #FFFFFF; padding: 12px 16px; border-radius: 18px 18px 4px 18px; font-size: 15px; line-height: 1.4">Brainstorm names for our new dashboard.</div>
<div role="status" aria-live="polite" style="display: flex; gap: 18px; align-items: center; padding-left: 6px">
<div style="position: relative; width: 30px; height: 30px; flex-shrink: 0">
<div class="blob ghost"></div>
<div class="blob"></div>
</div>
<div class="slot">
<sc-for list="{{items}}" as="item" hint-placeholder-count="5">
<span class="m {{item.cls}}">{{item.t}}</span>
</sc-for>
</div>
<span class="timer" aria-hidden="true">{{elapsed}}</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8B3DFF","options":["#8B3DFF","#3B5BFD","#E8590C","#0F9D74"]},"interval":{"editor":"int","default":2600,"min":800,"max":6000,"step":100,"unit":"ms"},"$preview":{"width":560,"height":320}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { i: 0 }; }
componentDidMount() { this.start = Date.now(); this.clock = setInterval(() => this.setState({ now: Date.now() }), 100); this.t = setInterval(() => this.setState((s) => ({ i: s.i + 1 })), this.props.interval ?? 2600); }
componentWillUnmount() { clearInterval(this.t); clearInterval(this.clock); }
fmt(ms) { const s = ms / 1000; if (s < 60) return s.toFixed(1) + 's'; const m = Math.floor(s / 60), r = Math.floor(s % 60); return m + 'm ' + String(r).padStart(2, '0') + 's'; }
renderVals() {
const msgs = ['Daydreaming…', 'Shuffling letters…', 'Reminiscing…', 'Testing how it sounds…', 'Saying it out loud…'];
const i = this.state.i, n = msgs.length, cur = i % n, prev = (i - 1 + n) % n;
return {
elapsed: this.fmt(Date.now() - (this.start || Date.now())),
accent: this.props.accent ?? '#8B3DFF',
items: msgs.map((t, k) => ({ t, cls: k === cur ? 'in' : (i > 0 && k === prev ? 'out' : '') }))
};
}
}
</script>
</body>
</html>
