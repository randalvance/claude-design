<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Typewriter loader</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.timer{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;font-weight:500;color:#6B7080;font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0}
.caret{display:inline-block;width:2px;height:18px;margin-left:2px;background:var(--accent);vertical-align:-3px;animation:blink 1s steps(1) infinite}
.caret.solid{animation:none}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
.pen{animation:nib .35s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes nib{from{transform:rotate(-8deg) translateY(0)}to{transform:rotate(8deg) translateY(-2px)}}
</style>
</helmet>
<div style="--accent: {{accent}}; width: 560px; height: 320px; box-sizing: border-box; padding: 32px; display: flex; flex-direction: column; gap: 24px; background: #FAFAFB; font-family: 'DM Sans', system-ui, sans-serif; color: #1B1D22">
<div style="align-self: flex-end; max-width: 360px; background: #1B1D22; color: #FFFFFF; padding: 12px 16px; border-radius: 18px 18px 4px 18px; font-size: 15px; line-height: 1.4">Draft a reply to the vendor about the renewal.</div>
<div style="display: flex; gap: 12px; align-items: center">
<div style="width: 32px; height: 32px; border-radius: 50%; background: #FFFFFF; border: 1px solid #E6E8EC; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: {{accent}}">
<svg class="pen" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
</div>
<div role="status" aria-live="polite" style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px; color: #3A3E48; white-space: pre; width: 280px">{{text}}<span class="caret {{caretCls}}"></span></div>
<span class="timer" aria-hidden="true">{{elapsed}}</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E8590C","options":["#E8590C","#3B5BFD","#0F9D74","#8B3DFF"]},"speed":{"editor":"int","default":45,"min":15,"max":150,"step":5,"unit":"ms"},"$preview":{"width":560,"height":320}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { i: 0, n: 0, phase: 'type', hold: 0 }; }
msgs() { return ['Clearing its throat…', 'Choosing the right words…', 'Negotiating contracts…', 'Softening the tone…', 'Rewriting the opener…', 'Adding a polite sign-off…']; }
componentDidMount() { this.start = Date.now(); this.clock = setInterval(() => this.setState({ now: Date.now() }), 100); this.t = setInterval(() => this.tick(), this.props.speed ?? 45); }
componentWillUnmount() { clearInterval(this.t); clearInterval(this.clock); }
fmt(ms) { const s = ms / 1000; if (s < 60) return s.toFixed(1) + 's'; const m = Math.floor(s / 60), r = Math.floor(s % 60); return m + 'm ' + String(r).padStart(2, '0') + 's'; }
tick() {
const s = this.state, msgs = this.msgs(), msg = msgs[s.i % msgs.length];
if (s.phase === 'type') {
if (s.n < msg.length) this.setState({ n: s.n + 1 });
else this.setState({ phase: 'hold', hold: 0 });
} else if (s.phase === 'hold') {
if (s.hold > 30) this.setState({ phase: 'del' });
else this.setState({ hold: s.hold + 1 });
} else {
if (s.n > 0) this.setState({ n: Math.max(0, s.n - 2) });
else this.setState({ phase: 'type', i: s.i + 1 });
}
}
renderVals() {
const s = this.state, msgs = this.msgs(), msg = msgs[s.i % msgs.length];
return {
elapsed: this.fmt(Date.now() - (this.start || Date.now())),
accent: this.props.accent ?? '#E8590C',
text: msg.slice(0, s.n),
caretCls: s.phase === 'hold' ? '' : 'solid'
};
}
}
</script>
</body>
</html>
