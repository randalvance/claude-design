<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Equalizer loader</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.timer{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;font-weight:500;color:#6B7080;font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0}
.eq{display:flex;align-items:center;gap:3px;height:20px}
.eq span{width:3px;height:100%;border-radius:2px;background:var(--accent);transform-origin:50% 50%;animation:eq 1s ease-in-out infinite}
.eq span:nth-child(1){animation-delay:-.2s}
.eq span:nth-child(2){animation-delay:-.6s}
.eq span:nth-child(3){animation-delay:-.1s}
.eq span:nth-child(4){animation-delay:-.45s}
.eq span:nth-child(5){animation-delay:-.8s}
@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.slot{position:relative;height:24px;width:230px}
.m{position:absolute;left:0;top:0;white-space:nowrap;line-height:24px;font-size:15px;font-weight:600;color:#1B1D22;transform-origin:left center;transform:scale(.5);opacity:0;transition:transform .55s cubic-bezier(.34,1.56,.64,1),opacity .25s ease}
.m.in{transform:scale(1);opacity:1}
.m.out{transform:scale(.5) translateY(-8px);opacity:0;transition:transform .3s ease-in,opacity .25s ease}
</style>
</helmet>
<div style="--accent: {{accent}}; width: 560px; height: 320px; box-sizing: border-box; padding: 32px; display: flex; flex-direction: column; gap: 24px; background: #FAFAFB; font-family: 'DM Sans', system-ui, sans-serif; color: #1B1D22">
<div style="align-self: flex-end; max-width: 360px; background: #1B1D22; color: #FFFFFF; padding: 12px 16px; border-radius: 18px 18px 4px 18px; font-size: 15px; line-height: 1.4">Turn these notes into meeting minutes.</div>
<div role="status" aria-live="polite" style="align-self: flex-start; display: flex; align-items: center; gap: 14px; padding: 10px 20px 10px 14px; background: #FFFFFF; border: 1px solid #E6E8EC; border-radius: 999px; box-shadow: 0 2px 8px rgba(20,22,27,.05)">
<div class="eq" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
<div class="slot">
<sc-for list="{{items}}" as="item" hint-placeholder-count="5">
<span class="m {{item.cls}}">{{item.t}}</span>
</sc-for>
</div>
<span aria-hidden="true" style="width: 1px; height: 18px; background: #E6E8EC"></span>
<span class="timer" aria-hidden="true">{{elapsed}}</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E8590C","options":["#E8590C","#3B5BFD","#0F9D74","#8B3DFF"]},"interval":{"editor":"int","default":2000,"min":800,"max":6000,"step":100,"unit":"ms"},"$preview":{"width":560,"height":320}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { i: 0 }; }
componentDidMount() { this.start = Date.now(); this.clock = setInterval(() => this.setState({ now: Date.now() }), 100); this.t = setInterval(() => this.setState((s) => ({ i: s.i + 1 })), this.props.interval ?? 2000); }
componentWillUnmount() { clearInterval(this.t); clearInterval(this.clock); }
fmt(ms) { const s = ms / 1000; if (s < 60) return s.toFixed(1) + 's'; const m = Math.floor(s / 60), r = Math.floor(s % 60); return m + 'm ' + String(r).padStart(2, '0') + 's'; }
renderVals() {
const msgs = ['Taking notes…', 'Reminiscing…', 'Tidying action items…', 'Assigning owners…', 'Crunching the numbers…'];
const i = this.state.i, n = msgs.length, cur = i % n, prev = (i - 1 + n) % n;
return {
elapsed: this.fmt(Date.now() - (this.start || Date.now())),
accent: this.props.accent ?? '#E8590C',
items: msgs.map((t, k) => ({ t, cls: k === cur ? 'in' : (i > 0 && k === prev ? 'out' : '') }))
};
}
}
</script>
</body>
</html>
