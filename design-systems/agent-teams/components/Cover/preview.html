<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
body{margin:0;background:var(--bg-000);width:960px;height:300px;position:relative;overflow:hidden;font-family:var(--font-sans)}
svg{position:absolute;inset:0}
.s1{fill:var(--surface-200)}.ac{fill:var(--accent)}.vi{fill:var(--kind-subagent)}.cy{fill:var(--kind-think)}.mi{fill:var(--kind-edit)}.am{fill:var(--kind-ask)}.er{fill:var(--err)}.ink{fill:var(--ink-100)}
.gl{filter:url(#glow)}
.name{position:absolute;left:48px;bottom:58px;margin:0;font:600 96px/.92 var(--font-sans);letter-spacing:-.02em;color:var(--ink-100);max-width:440px}
.tag{position:absolute;left:48px;bottom:32px;margin:0;font:400 13px/1.3 var(--font-sans);color:var(--ink-300);max-width:440px}
</style></head><body>
<!--
blocks: surface-200 slab 288×192 (space-8 × 6, space-12 × 4) · accent slab 144×96 · kind-subagent 96×96 · kind-think 48×96 · kind-edit disc 48 · err dot 16 — the kind palette at full value, agents' hues weighted over status
arrangement: a staggered stack bleeding off the right and top edges, as the thread stacks capsules; the accent slab glows (the one lit surface)
pattern: a dot trail at space-5 (20px) pitch in kind colours over the slab — "step kinds carry colour, not shape"; said-steps are 2px squares
scales: steps space-5/space-8/space-12, radii radius-lg 12 on slabs, radius-pill on discs, radius-xs 2 on said squares
-->
<svg viewBox="0 0 960 300" aria-hidden="true">
 <defs><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
 <rect class="s1" x="520" y="-24" width="288" height="192" rx="12"/>
 <rect class="ac gl" x="760" y="120" width="144" height="96" rx="12" opacity=".95"/>
 <rect class="vi" x="864" y="-24" width="120" height="120" rx="12"/>
 <rect class="cy" x="520" y="192" width="48" height="96" rx="12"/>
 <rect class="s1" x="592" y="192" width="144" height="132" rx="12"/>
 <circle class="mi" cx="904" cy="252" r="24"/>
 <circle class="er" cx="760" cy="252" r="8"/>
 <g>
  <circle class="ac" cx="560" cy="40" r="7"/><circle class="am" cx="580" cy="40" r="7"/><circle class="ac" cx="600" cy="40" r="7"/><circle class="ac" cx="620" cy="40" r="7"/><circle class="er" cx="640" cy="40" r="7"/><circle class="cy" cx="660" cy="40" r="7"/><circle class="mi" cx="680" cy="40" r="7"/><rect class="ink" x="693" y="33" width="14" height="14" rx="2" opacity=".8"/><circle class="vi" cx="720" cy="40" r="7"/>
  <circle class="cy" cx="560" cy="80" r="7"/><circle class="ac" cx="580" cy="80" r="7"/><circle class="vi" cx="600" cy="80" r="7"/><circle class="vi" cx="620" cy="80" r="7"/><circle class="mi" cx="640" cy="80" r="7"/><rect class="ink" x="653" y="73" width="14" height="14" rx="2" opacity=".8"/>
  <circle class="ac" cx="560" cy="120" r="7"/><circle class="ac" cx="580" cy="120" r="7"/><circle class="am" cx="600" cy="120" r="7"/><circle class="mi" cx="620" cy="120" r="7"/>
  <circle class="cy" cx="620" cy="232" r="7"/><circle class="ac" cx="640" cy="232" r="7"/><circle class="ac" cx="660" cy="232" r="7"/><circle class="vi" cx="680" cy="232" r="7"/><circle class="mi" cx="700" cy="232" r="7"/>
  <circle class="ac" cx="620" cy="272" r="7"/><rect class="ink" x="633" y="265" width="14" height="14" rx="2" opacity=".8"/><circle class="mi" cx="660" cy="272" r="7"/>
 </g>
</svg>
<h1 class="name">Agent Teams</h1>
<p class="tag">A dark, glowing system for an app that runs teams of AI agents.</p>
</body></html>
