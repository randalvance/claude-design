<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>body{margin:0;background:var(--bg-000);padding:16px;box-sizing:border-box}#root{display:flex;flex-wrap:wrap;gap:16px;align-items:center}</style></head>
<body><div id="root" class="at-root"></div>
<script>
(function(){var D=window.AgentTeamsDS,h=React.createElement;
function App(){return h(React.Fragment,null,
 h(D.AgentAvatar,{name:'Scout',glyph:'search',status:'live'}),
 h(D.AgentAvatar,{name:'Builder',glyph:'wrench',status:'done'}),
 h(D.AgentAvatar,{name:'Reviewer',glyph:'shield',status:'error'}),
 h(D.AgentAvatar,{name:'Planner',glyph:'compass',status:'ask'}),
 h(D.AgentAvatar,{name:'Orchestrator',glyph:'bot',size:40,filled:true}),
 h(D.AgentAvatar.Stack,{agents:[{name:'Scout',glyph:'search'},{name:'Builder',glyph:'wrench'},{name:'Reviewer',glyph:'shield'},{name:'Planner',glyph:'compass'}]}),
 h('span',{className:'at-stack'},[1,2,3,4,5,6,7,8].map(function(i){return h(D.AgentAvatar,{key:i,hue:i,size:22,filled:true,glyph:'spark'})})));}
ReactDOM.createRoot(document.getElementById('root')).render(App());})();
</script></body></html>
